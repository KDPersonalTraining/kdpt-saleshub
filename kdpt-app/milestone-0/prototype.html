<title>KDPT App Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Poppins:wght@400;500;600&display=swap">
<style>
/* Layout: the client app alone. On a phone it fills the screen; on a desktop it
   sits in a device frame. Dark-only by design. Mint is the brand and training
   colour; food, check-ins and alerts each get their own hue so they stand apart. */
:root {
  --bg: #000000;
  --s1: #0d0e0e;
  --s2: #151716;
  --s3: #1e211f;
  --hair: rgba(255,255,255,0.08);
  --fg: #f5f7f6;
  --fg2: #a2a8a5;
  --fg3: #676d6a;
  --mint: #7ed597;
  --mint-ink: #03140a;
  --amber: #ffb45e;
  --violet: #a99bff;
  --sky: #6ec6ff;
  --coral: #ff6b5e;
  --display: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
  --body: 'Poppins', 'Helvetica Neue', Arial, sans-serif;
  --gut: max(20px, env(safe-area-inset-left, 0px));
  --gut-r: max(20px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.45; }
h1, h2, h3, .d { font-family: var(--display); margin: 0; letter-spacing: -0.02em; text-wrap: balance; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--mint); outline-offset: 3px; border-radius: 12px; }
svg { display: block; }
.num { font-variant-numeric: tabular-nums; }

/* ---- Device ------------------------------------------------------------ */
.device { position: relative; height: 100%; overflow: hidden; background: var(--bg); }
.screen { height: 100%; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
.screen::-webkit-scrollbar { display: none; }
.statusbar { display: none; }
@media (min-width: 700px) {
  body { display: grid; place-items: center; padding-block: 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
         background: radial-gradient(60% 50% at 50% 40%, #0f1a13 0%, #000 70%); min-height: 100%; height: auto; }
  .device { width: 393px; height: 852px; border-radius: 54px; box-shadow: 0 0 0 11px #111312, 0 0 0 12px #2a2d2b, 0 40px 120px rgba(0,0,0,.8); }
  .statusbar { display: flex; position: absolute; inset: 0 0 auto; height: 50px; padding: 16px 32px 0; justify-content: space-between; font: 600 15px var(--display); z-index: 30; pointer-events: none; }
  .statusbar i { width: 120px; height: 34px; border-radius: 20px; background: #000; position: absolute; left: 50%; top: 11px; transform: translateX(-50%); }
  .screen { padding-top: 34px; }
}
.page { padding: 12px var(--gut-r) 120px var(--gut); display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }
.page.flush { padding-top: 0; }

/* ---- Tab bar ----------------------------------------------------------- */
.tabbar { position: absolute; left: 12px; right: 12px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); height: 68px; border-radius: 26px;
  background: rgba(22,24,23,.78); backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%);
  border: 1px solid var(--hair); display: grid; grid-template-columns: repeat(5, 1fr); z-index: 20; }
.tabbar button { display: grid; place-items: center; align-content: center; gap: 4px; color: var(--fg3); position: relative; transition: color .2s; }
.tabbar button span { font-size: 10px; font-weight: 500; letter-spacing: .02em; }
.tabbar button.on { color: var(--fg); }
.tabbar button.on svg { color: var(--mint); }
.tabbar .pip { position: absolute; top: 12px; right: calc(50% - 16px); width: 8px; height: 8px; border-radius: 50%; background: var(--coral); box-shadow: 0 0 0 2px #161817; }
.tabbar[hidden] { display: none; }

/* ---- Shared bits ------------------------------------------------------- */
.ic { width: 22px; height: 22px; }
.glass { background: rgba(255,255,255,.1); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.12); }
.round { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 15px; font-size: 13px; font-weight: 500; }
.chip svg { width: 15px; height: 15px; }
.eyebrow { font: 600 11px var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--fg3); }
.sec-head { display: flex; justify-content: space-between; align-items: baseline; }
.sec-head h2 { font-size: 20px; font-weight: 700; }
.sec-head button { font-size: 14px; color: var(--fg2); }
.card { background: var(--s2); border-radius: 24px; }
.pill-btn { height: 56px; border-radius: 28px; padding: 0 26px; font: 700 16px var(--display); display: inline-flex; align-items: center; justify-content: center; gap: 10px; letter-spacing: -.01em; }
.pill-btn.mint { background: var(--mint); color: var(--mint-ink); }
.pill-btn.white { background: var(--fg); color: #000; }
.pill-btn.dark { background: var(--s3); color: var(--fg); }
.avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font: 700 14px var(--display); }

/* ---- Home -------------------------------------------------------------- */
.topbar { display: flex; justify-content: space-between; align-items: center; padding-top: 6px; }
.topbar img { height: 22px; width: auto; }
.topbar .avatar { background: linear-gradient(135deg, #2c3a31, #1a201c); color: var(--mint); width: 38px; height: 38px; font-size: 13px; }
.greet .eyebrow { margin-bottom: 4px; }
.greet h1 { font-size: 32px; font-weight: 800; line-height: 1.05; }

.hero { position: relative; height: 340px; border-radius: 30px; overflow: hidden; display: flex; align-items: flex-end; text-align: left; width: 100%; }
.hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 30%, rgba(0,0,0,.55) 58%, rgba(0,0,0,.92) 100%); }
.hero .in { position: relative; z-index: 1; padding: 22px; width: 100%; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.hero .tag { position: absolute; top: 18px; left: 18px; z-index: 1; background: rgba(0,0,0,.45); }
.hero h2 { font-size: 30px; font-weight: 800; line-height: 1.02; margin-top: 6px; }
.hero .meta { display: flex; gap: 14px; margin-top: 10px; color: rgba(255,255,255,.78); font-size: 14px; }
.hero .meta span { display: inline-flex; align-items: center; gap: 6px; }
.hero .meta svg { width: 16px; height: 16px; }
.play { width: 64px; height: 64px; border-radius: 50%; background: var(--mint); color: var(--mint-ink); display: grid; place-items: center; flex: none; box-shadow: 0 10px 30px rgba(126,213,151,.35); }
.play svg { width: 26px; height: 26px; margin-left: 3px; }

.mom { padding: 18px 18px 18px 16px; display: flex; gap: 16px; align-items: center; width: 100%; text-align: left; }
.mom .t { flex: 1; min-width: 0; display: grid; gap: 2px; }
.mom .word { font: 800 26px var(--display); letter-spacing: -.02em; color: var(--mint); line-height: 1.1; }
.mom .t small { color: var(--fg2); font-size: 14px; }
.mom-big { display: grid; justify-items: center; gap: 10px; text-align: center; }
.mom-big .wrap { position: relative; width: 184px; height: 184px; }
.mom-big .wrap .c { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; }
.mom-big .wrap b { font: 800 30px var(--display); color: var(--mint); letter-spacing: -.02em; }
.mom-big .wrap small { color: var(--fg3); font-size: 12px; }
.mom-big p { margin: 0; color: var(--fg2); font-size: 15px; max-width: 30ch; }
.contrib { display: grid; gap: 10px; }
.crow { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 18px; background: var(--s2); }
.crow .li { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; }
.crow .li svg { width: 20px; height: 20px; }
.crow b { font: 700 15px var(--display); display: block; }
.crow small { color: var(--fg3); font-size: 12px; }
.crow .bar { margin-top: 6px; }
.crow .st { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 10px; white-space: nowrap; }
.trend { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; height: 110px; padding: 0 4px; }
.trend div { display: grid; justify-items: center; gap: 6px; height: 100%; align-content: end; font-size: 11px; color: var(--fg3); }
.trend i { width: 100%; max-width: 30px; border-radius: 8px; background: var(--s3); }
.trend .on i { background: var(--mint); }
.trend .now i { background: repeating-linear-gradient(135deg, rgba(126,213,151,.5) 0 4px, rgba(126,213,151,.25) 4px 8px); }
.trend .now { color: var(--fg); }
.foot { color: var(--fg3); font-size: 12px; text-align: center; }
.awards { display: flex; gap: 14px; overflow-x: auto; scrollbar-width: none; }
.award { flex: none; width: 92px; display: grid; justify-items: center; gap: 8px; text-align: center; font-size: 12px; color: var(--fg2); }
.award .medal { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; position: relative; }
.award .medal::before { content: ""; position: absolute; inset: 0; border-radius: 50%; padding: 2px; background: conic-gradient(from 200deg, var(--c), transparent 60%, var(--c)); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
.award .medal svg { width: 28px; height: 28px; }
.award.locked { opacity: .35; }
.headline { color: var(--fg2); font-size: 15px; margin-top: 6px; }
.legend { display: grid; gap: 14px; }
.legend div { display: grid; grid-template-columns: 30px minmax(0,1fr); gap: 10px; align-items: center; }
.legend .li { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; }
.legend .li svg { width: 16px; height: 16px; }
.legend b { font: 700 18px var(--display); display: block; line-height: 1.1; }
.legend small { color: var(--fg3); font-size: 12px; }

.strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.strip div { display: grid; justify-items: center; gap: 8px; font-size: 12px; color: var(--fg3); }
.strip i { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font: 600 13px var(--display); font-style: normal; color: var(--fg2); background: var(--s2); }
.strip i svg { width: 16px; height: 16px; }
.strip .done i { background: var(--mint); color: var(--mint-ink); }
.strip .pt i { background: rgba(110,198,255,.16); color: var(--sky); }
.strip .now i { background: var(--fg); color: #000; }
.strip .now { color: var(--fg); }

.actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.act { display: grid; justify-items: center; gap: 8px; font-size: 12px; color: var(--fg2); }
.act i { width: 60px; height: 60px; border-radius: 20px; display: grid; place-items: center; }
.act i svg { width: 24px; height: 24px; }

.session { display: flex; align-items: center; gap: 16px; padding: 14px; width: 100%; text-align: left; }
.datebox { width: 58px; height: 62px; border-radius: 16px; background: rgba(110,198,255,.12); color: var(--sky); display: grid; place-items: center; align-content: center; flex: none; }
.datebox small { font: 700 10px var(--display); letter-spacing: .12em; }
.datebox b { font: 800 24px var(--display); line-height: 1; }
.session .t { flex: 1; min-width: 0; }
.session .t b { display: block; font: 700 17px var(--display); }
.session .t span { color: var(--fg3); font-size: 13px; display: inline-flex; gap: 5px; align-items: center; }
.session .t span svg { width: 14px; height: 14px; }
.chev { color: var(--fg3); }

.note { padding: 18px; display: flex; gap: 14px; align-items: flex-start; width: 100%; text-align: left; }
.note img.mark { width: 40px; height: 40px; border-radius: 50%; background: #0b0c0c; object-fit: contain; padding: 9px 6px; flex: none; border: 1px solid var(--hair); }
.note p { margin: 2px 0 0; font-size: 15px; color: var(--fg); }
.note small { color: var(--fg3); font-size: 12px; }

/* ---- Train ------------------------------------------------------------- */
.block { padding: 20px; display: grid; gap: 14px; }
.segs { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
.segs i { height: 6px; border-radius: 3px; background: var(--s3); }
.segs i.on { background: var(--mint); }
.segs i.cur { background: linear-gradient(90deg, var(--mint) 50%, var(--s3) 50%); }
.wrow { display: flex; align-items: center; gap: 14px; padding: 14px; width: 100%; text-align: left; }
.wrow .tile { width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; flex: none; background: var(--s3); color: var(--fg2); }
.wrow .tile svg { width: 24px; height: 24px; }
.wrow.today .tile { background: var(--mint); color: var(--mint-ink); }
.wrow.done .tile { background: rgba(126,213,151,.14); color: var(--mint); }
.wrow .t { flex: 1; min-width: 0; }
.wrow .t b { font: 700 16px var(--display); display: block; }
.wrow .t span { font-size: 13px; color: var(--fg3); }

/* ---- Workout ----------------------------------------------------------- */
.media { position: relative; height: 330px; overflow: hidden; }
.media img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 28%; }
.media::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.45) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,0) 60%, #000 100%); }
.media .ctl { position: absolute; z-index: 2; top: 14px; left: var(--gut); right: var(--gut-r); display: flex; justify-content: space-between; align-items: center; }
@media (min-width: 700px) { .media .ctl { top: 50px; } }
.media .ctl .chip { color: #fff; }
.media .dots { display: flex; gap: 5px; }
.media .dots i { width: 6px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.35); transition: width .3s; }
.media .dots i.on { width: 20px; background: #fff; }
.media .dots i.done { background: var(--mint); }
.media .playing { position: absolute; z-index: 2; left: var(--gut); bottom: 18px; color: rgba(255,255,255,.8); }
.ex-title h1 { font-size: 30px; font-weight: 800; line-height: 1.05; }
.ex-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.ex-meta .chip { background: var(--s2); color: var(--fg2); }
.target { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 22px; width: 100%; text-align: left; }
.target.up { background: linear-gradient(120deg, rgba(126,213,151,.2), rgba(126,213,151,.06)); }
.target.hold { background: var(--s2); }
.target .arrow { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; flex: none; }
.target.up .arrow { background: var(--mint); color: var(--mint-ink); }
.target.hold .arrow { background: var(--s3); color: var(--fg2); }
.target b { font: 800 24px var(--display); display: block; line-height: 1.1; }
.target small { color: var(--fg2); font-size: 13px; }
.target .why { margin-left: auto; color: var(--fg3); }
.why-text { font-size: 14px; color: var(--fg2); margin: -10px 4px 0; }

.sets { display: grid; gap: 10px; }
.setrow { display: grid; grid-template-columns: 36px minmax(0,1fr) minmax(0,1fr) 60px; align-items: center; gap: 10px; background: var(--s1); border: 1px solid var(--hair); border-radius: 22px; padding: 10px 10px 10px 12px; transition: background .25s, border-color .25s; }
.setrow .n { width: 32px; height: 32px; border-radius: 50%; background: var(--s3); display: grid; place-items: center; font: 700 13px var(--display); color: var(--fg2); }
.val { display: grid; }
.val input { background: none; border: 0; color: var(--fg); font: 800 26px var(--display); width: 100%; padding: 0; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.val input:focus { outline: none; color: var(--mint); }
.val input::placeholder { color: var(--fg3); }
.val small { font-size: 11px; color: var(--fg3); letter-spacing: .04em; }
.tick { width: 56px; height: 56px; border-radius: 50%; border: 2px solid var(--s3); display: grid; place-items: center; color: var(--fg3); transition: all .2s; }
.tick svg { width: 26px; height: 26px; }
.setrow.done { background: rgba(126,213,151,.08); border-color: rgba(126,213,151,.25); }
.setrow.done .tick { background: var(--mint); border-color: var(--mint); color: var(--mint-ink); }
.setrow.done .n { background: rgba(126,213,151,.18); color: var(--mint); }
@media (prefers-reduced-motion: no-preference) { .setrow.done .tick { animation: pop .35s ease; } @keyframes pop { 50% { transform: scale(1.12); } } }

.dock { position: absolute; left: 0; right: 0; bottom: 0; z-index: 15; padding: 14px var(--gut-r) calc(20px + env(safe-area-inset-bottom, 0px)) var(--gut);
  background: linear-gradient(180deg, rgba(0,0,0,0), #000 35%); display: flex; gap: 10px; align-items: center; }
.dock .round { width: 56px; height: 56px; background: var(--s2); border: 1px solid var(--hair); }
.dock .round.pain { color: var(--coral); }
.dock .pill-btn { flex: 1; }

/* ---- Sheets & overlays ------------------------------------------------- */
.scrim { position: absolute; inset: 0; z-index: 40; background: rgba(0,0,0,.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: flex; align-items: flex-end; }
.sheet { grid-template-columns: minmax(0, 1fr); width: 100%; background: var(--s1); border-top: 1px solid var(--hair); border-radius: 34px 34px 0 0; padding: 12px var(--gut-r) calc(28px + env(safe-area-inset-bottom, 0px)) var(--gut); display: grid; gap: 20px; max-height: 92%; overflow-y: auto; }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .32s cubic-bezier(.2,.9,.3,1); } @keyframes up { from { transform: translateY(40px); opacity: .4; } } }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--s3); margin: 0 auto; }
.sheet h3 { font-size: 24px; font-weight: 800; }
.sheet .sub { color: var(--fg2); font-size: 14px; margin-top: 4px; }
.opts { display: grid; gap: 10px; }
.opt { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 20px; background: var(--s2); border: 1.5px solid transparent; text-align: left; width: 100%; }
.opt .tile { width: 48px; height: 48px; border-radius: 14px; background: var(--s3); display: grid; place-items: center; flex: none; color: var(--fg2); }
.opt b { font: 700 16px var(--display); display: block; }
.opt span { font-size: 13px; color: var(--fg3); }
.opt[aria-pressed="true"] { border-color: var(--fg); }

.durs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.dur { aspect-ratio: 1; max-width: 100%; border-radius: 50%; background: var(--s2); display: grid; place-items: center; align-content: center; border: 2px solid transparent; }
.dur b { font: 800 24px var(--display); line-height: 1; }
.dur small { font-size: 11px; color: var(--fg3); }
.dur[aria-pressed="true"] { background: var(--fg); color: #000; }
.dur[aria-pressed="true"] small { color: #444; }
.cutlist { display: grid; gap: 8px; }
.cutlist div { display: flex; justify-content: space-between; align-items: center; font-size: 15px; padding: 10px 14px; border-radius: 14px; background: var(--s2); }
.cutlist div.cut { background: none; color: var(--fg3); text-decoration: line-through; }
.cutlist div.trim span { color: var(--amber); }
.cutlist span { color: var(--fg3); font-size: 13px; font-variant-numeric: tabular-nums; text-decoration: none; }

.areas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.area { height: 52px; border-radius: 16px; background: var(--s2); font-weight: 500; font-size: 14px; border: 1.5px solid transparent; }
.area[aria-pressed="true"] { border-color: var(--coral); color: var(--coral); background: rgba(255,107,94,.1); }
.sev { display: grid; gap: 12px; }
.sev .big { display: flex; align-items: baseline; gap: 10px; }
.sev .big b { font: 800 48px var(--display); line-height: 1; }
.sev .big span { color: var(--fg2); }
.sev input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 10px; border-radius: 5px; background: linear-gradient(90deg, var(--mint), var(--amber) 55%, var(--coral)); }
.sev input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; border-radius: 50%; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.5); }
.sev input[type=range]::-moz-range-thumb { width: 30px; height: 30px; border-radius: 50%; background: #fff; border: 0; }
.tri { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tri button { border-radius: 20px; background: var(--s2); padding: 16px 8px; display: grid; justify-items: center; gap: 8px; font-size: 13px; font-weight: 500; border: 1.5px solid transparent; }
.tri button svg { width: 24px; height: 24px; }
.tri button[aria-pressed="true"] { border-color: var(--fg); }
.sent { display: grid; justify-items: center; text-align: center; gap: 12px; padding: 12px 0; }
.sent .ok { width: 76px; height: 76px; border-radius: 50%; background: var(--mint); color: var(--mint-ink); display: grid; place-items: center; }
.sent .ok svg { width: 36px; height: 36px; }
.sent p { margin: 0; color: var(--fg2); font-size: 14px; max-width: 30ch; }

.rest { position: absolute; inset: 0; z-index: 45; background: rgba(0,0,0,.86); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); display: grid; place-items: center; align-content: center; gap: 28px; text-align: center; }
.rest .ringwrap { position: relative; width: 240px; height: 240px; }
.rest .ringwrap .c { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; }

.finish { min-height: 100%; display: grid; align-content: center; justify-items: center; gap: 26px; padding: 60px var(--gut-r) 40px var(--gut); text-align: center; }

.stats { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.stat svg { width: 20px; height: 20px; }
.stat b { font: 800 26px var(--display); letter-spacing: -.02em; }
.stat small { color: var(--fg3); font-size: 12px; }

/* ---- Fuel -------------------------------------------------------------- */
.macro { padding: 20px; display: grid; grid-template-columns: 140px minmax(0,1fr); gap: 18px; align-items: center; }
.macro .lines { display: grid; gap: 14px; }
.macro .line small { color: var(--fg3); font-size: 12px; display: block; }
.macro .line b { font: 800 22px var(--display); }
.macro .line b span { font-size: 14px; color: var(--fg3); font-weight: 600; }
.bar { height: 6px; border-radius: 3px; background: var(--s3); margin-top: 6px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; }
.meals { display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; margin: 0 calc(-1 * var(--gut-r)) 0 calc(-1 * var(--gut)); padding: 0 var(--gut-r) 0 var(--gut); scroll-snap-type: x mandatory; scroll-padding-inline: var(--gut) var(--gut-r); }
.meals::-webkit-scrollbar { display: none; }
.meal { flex: none; width: 150px; scroll-snap-align: start; text-align: left; }
.meal .ph { width: 150px; height: 180px; border-radius: 22px; overflow: hidden; position: relative; background: var(--s2); display: grid; place-items: center; }
.meal .ph img { width: 100%; height: 100%; object-fit: cover; }
.meal .ph .ok { position: absolute; top: 10px; right: 10px; width: 26px; height: 26px; border-radius: 50%; background: var(--amber); color: #2a1600; display: grid; place-items: center; }

.recipe { flex: none; width: 240px; scroll-snap-align: start; text-align: left; }
.recipe .ph { height: 150px; border-radius: 22px; overflow: hidden; }

.recipe b { display: block; font: 700 15px var(--display); margin-top: 10px; }
.recipe .tags { display: flex; gap: 10px; color: var(--fg3); font-size: 12px; margin-top: 2px; }
.recipe .tags span:first-child { color: var(--amber); }

/* ---- Progress ---------------------------------------------------------- */
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--s2); border-radius: 16px; padding: 4px; }
.seg button { height: 38px; border-radius: 12px; font-size: 14px; font-weight: 500; color: var(--fg2); }
.seg button.on { background: var(--s3); color: var(--fg); }
.big-stat { padding: 22px 22px 14px; display: grid; gap: 4px; }
.big-stat .delta { font: 800 52px var(--display); letter-spacing: -.04em; color: var(--mint); line-height: 1; }
.big-stat .lbl { color: var(--fg2); font-size: 14px; }
.chart { width: 100%; height: auto; margin-top: 10px; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mini { padding: 18px; display: grid; gap: 4px; }
.mini svg.i { width: 20px; height: 20px; margin-bottom: 6px; }
.mini b { font: 800 26px var(--display); letter-spacing: -.02em; }
.mini small { color: var(--fg3); font-size: 12px; }
.heat { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; padding: 20px; }
.heat .col { display: grid; gap: 6px; }
.heat i { aspect-ratio: 1; max-width: 100%; border-radius: 6px; background: var(--s3); }
.heat i.l1 { background: rgba(126,213,151,.35); }
.heat i.l2 { background: var(--mint); }

/* ---- Chat -------------------------------------------------------------- */
.chat-head { display: flex; align-items: center; gap: 12px; padding-top: 6px; }
.chat-head img { width: 44px; height: 44px; border-radius: 50%; background: #0b0c0c; object-fit: contain; padding: 10px 7px; border: 1px solid var(--hair); }

.msgs { display: grid; gap: 8px; }
.msg { max-width: 80%; padding: 12px 16px; border-radius: 22px; font-size: 15px; }
.msg.them { background: var(--s2); border-bottom-left-radius: 8px; justify-self: start; }
.msg.me { background: var(--mint); color: var(--mint-ink); border-bottom-right-radius: 8px; justify-self: end; }
.stamp { text-align: center; font-size: 11px; color: var(--fg3); margin: 8px 0 2px; }
.composer { display: flex; gap: 8px; align-items: center; }
.composer label { flex: 1; min-width: 0; height: 50px; border-radius: 25px; background: var(--s2); display: flex; align-items: center; padding: 0 18px; }
.composer input { flex: 1; min-width: 0; background: none; border: 0; color: var(--fg); font: 15px var(--body); }
.composer input:focus { outline: none; }
.composer .round { flex: none; width: 50px; height: 50px; background: var(--mint); color: var(--mint-ink); }

.topbar .right { display: flex; gap: 8px; align-items: center; }
.topbar .ib { width: 38px; height: 38px; border-radius: 50%; background: var(--s2); display: grid; place-items: center; position: relative; color: var(--fg); }
.topbar .ib svg { width: 19px; height: 19px; }
.topbar .ib .badge { position: absolute; top: -3px; right: -3px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--coral); color: #2a0703; font: 700 10px var(--display); display: grid; place-items: center; padding: 0 4px; box-shadow: 0 0 0 2px var(--bg); }
.topbar .ib .dot { position: absolute; top: 1px; right: 1px; width: 9px; height: 9px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 0 2px var(--bg); }

/* Onboarding */
.onb { min-height: 100%; display: flex; flex-direction: column; }
.onb-photo { height: 420px; position: relative; overflow: hidden; }
.onb-photo img { width: 100%; height: 100%; object-fit: cover; object-position: 40% 30%; }
.onb-photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.1) 30%, #000 96%); }
.onb-body { padding: 0 var(--gut-r) 40px var(--gut); display: grid; gap: 16px; margin-top: -70px; position: relative; }
.onb-mark { height: 30px; width: auto; }
.onb h1 { font-size: 34px; font-weight: 800; line-height: 1.05; }
.onb .lead { color: var(--fg2); font-size: 16px; margin: 0; }
@media (prefers-reduced-motion: no-preference) {
  .onb-mark { animation: markin .9s cubic-bezier(.2,.9,.3,1) both; }
  .onb-body h1 { animation: markin .9s .15s cubic-bezier(.2,.9,.3,1) both; }
  .onb-body .lead, .onb-body .pill-btn { animation: markin .9s .3s cubic-bezier(.2,.9,.3,1) both; }
  @keyframes markin { from { opacity: 0; transform: translateY(14px); } }
}
.onb-top { display: flex; align-items: center; gap: 14px; padding: 14px var(--gut-r) 0 var(--gut); }
.onb-prog { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.onb-prog i { height: 4px; border-radius: 2px; background: var(--s3); transition: background .3s; }
.onb-prog i.on { background: var(--mint); }
.onb-step { padding: 26px var(--gut-r) 140px var(--gut); display: grid; gap: 22px; align-content: start; }
.onb-step h1 { font-size: 28px; }
.goal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.goal { min-height: 132px; border-radius: 24px; background: var(--s2); display: grid; align-content: space-between; padding: 16px; text-align: left; border: 2px solid transparent; font: 700 16px var(--display); }
.goal .gi { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; }
.goal[aria-pressed="true"] { border-color: var(--mint); background: rgba(126,213,151,.07); }
.days-pick { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.days-pick button { aspect-ratio: 1; max-width: 100%; border-radius: 50%; background: var(--s2); font: 800 24px var(--display); }
.days-pick button[aria-pressed="true"] { background: var(--fg); color: #000; }
.freq { display: grid; gap: 10px; }
.fopt { display: flex; gap: 14px; align-items: center; padding: 16px; border-radius: 22px; background: var(--s2); border: 2px solid transparent; text-align: left; width: 100%; }
.fopt[aria-pressed="true"] { border-color: var(--violet); background: rgba(169,155,255,.08); }
.fopt .t { flex: 1; min-width: 0; }
.fopt b { font: 700 17px var(--display); display: block; }
.fopt small { color: var(--fg3); font-size: 13px; }
.acc { display: flex; gap: 3px; align-items: flex-end; }
.acc i { width: 6px; border-radius: 3px; background: var(--s4, #2a2d2b); }
.acc i:nth-child(1) { height: 8px; } .acc i:nth-child(2) { height: 13px; } .acc i:nth-child(3) { height: 18px; }
.acc i.on { background: var(--violet); }
.preview { display: flex; gap: 14px; align-items: center; padding: 14px 16px; border-radius: 20px; background: var(--s1); border: 1px solid var(--hair); }
.preview b { font: 700 15px var(--display); display: block; }
.preview small { color: var(--fg3); font-size: 12px; }
.daychips { display: flex; gap: 6px; flex-wrap: wrap; }
.daychips button { height: 40px; padding: 0 16px; border-radius: 20px; background: var(--s2); font-weight: 500; font-size: 14px; }
.daychips button[aria-pressed="true"] { background: var(--violet); color: #120d2b; }
.toggles { display: grid; gap: 8px; }
.tg { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 18px; background: var(--s2); }
.tg .li { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; flex: none; }
.tg .li svg { width: 18px; height: 18px; }
.tg span.t { flex: 1; min-width: 0; }
.tg b { font-weight: 600; font-size: 15px; display: block; }
.tg small { color: var(--fg3); font-size: 12px; }
.sw { width: 50px; height: 30px; border-radius: 15px; background: var(--s3); position: relative; flex: none; transition: background .2s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; }
.sw[aria-checked="true"] { background: var(--mint); }
.sw[aria-checked="true"]::after { transform: translateX(20px); }
.onb-done { min-height: 100%; display: grid; place-items: center; align-content: center; gap: 22px; text-align: center; padding: 60px var(--gut-r) 40px var(--gut); }
.onb-done h1 { font-size: 34px; font-weight: 800; }
.summary { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.summary .chip { background: var(--s2); color: var(--fg2); }

/* Notifications */
.ntop { display: flex; align-items: center; gap: 12px; padding-top: 6px; }
.ntop h1 { flex: 1; font-size: 28px; font-weight: 800; }
.ntop .ib { width: 44px; height: 44px; border-radius: 50%; background: var(--s2); display: grid; place-items: center; }
.ngroup { display: grid; gap: 8px; }
.nrow { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; padding: 14px; border-radius: 20px; background: var(--s2); text-align: left; width: 100%; position: relative; }
.nrow.unread::after { content: ""; position: absolute; top: 18px; right: 16px; width: 8px; height: 8px; border-radius: 50%; background: var(--coral); }
.nrow .li { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; }
.nrow .li svg { width: 20px; height: 20px; }
.nrow b { font-weight: 600; font-size: 15px; display: block; padding-right: 18px; }
.nrow p { margin: 2px 0 0; color: var(--fg2); font-size: 14px; }
.nrow time { color: var(--fg3); font-size: 12px; display: block; margin-top: 4px; }
.cta { margin-top: 10px; display: inline-flex; align-items: center; height: 34px; padding: 0 14px; border-radius: 17px; font: 600 13px var(--display); }

/* Community */
.drop { border-radius: 28px; background: linear-gradient(160deg, #221d38 0%, var(--s2) 62%); border: 1px solid rgba(169,155,255,.2); padding: 20px; display: grid; gap: 12px; }
.drop .by { display: flex; gap: 10px; align-items: center; }
.drop .by img { width: 36px; height: 36px; border-radius: 50%; background: #000; object-fit: contain; padding: 8px 5px; }
.drop .by b { font-size: 14px; font-weight: 600; display: block; }
.drop .by small { color: var(--fg3); font-size: 12px; }
.drop h2 { font-size: 24px; font-weight: 800; line-height: 1.1; }
.drop p { margin: 0; color: var(--fg2); font-size: 15px; }
.reacts { display: flex; gap: 8px; }
.react { height: 36px; padding: 0 12px; border-radius: 18px; background: rgba(255,255,255,.07); display: inline-flex; gap: 6px; align-items: center; font: 600 13px var(--display); }

.react.on { background: var(--violet); color: #120d2b; }
.meal3 { display: grid; gap: 10px; }
.m3 { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 10px 14px 10px 10px; border-radius: 22px; background: var(--s2); text-align: left; width: 100%; }
.m3 img { width: 92px; height: 92px; border-radius: 16px; object-fit: cover; }
.m3 b { font: 700 16px var(--display); display: block; line-height: 1.2; }
.m3 .macros { display: flex; gap: 10px; margin-top: 6px; font-size: 12px; color: var(--fg3); }
.m3 .macros span:first-child { color: var(--amber); font-weight: 600; }
.m3 .add { width: 38px; height: 38px; border-radius: 50%; background: rgba(255,180,94,.14); color: var(--amber); display: grid; place-items: center; }
.m3 .add.on { background: var(--amber); color: #2a1600; }
.ann { display: flex; gap: 14px; padding: 16px; border-radius: 20px; background: var(--s2); align-items: center; text-align: left; width: 100%; }
.ann .li { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; flex: none; }
.ann .t { flex: 1; min-width: 0; }
.ann b { font-weight: 600; display: block; }
.ann small { color: var(--fg3); font-size: 13px; }

/* Push banner */
.push { position: absolute; left: 10px; right: 10px; top: 10px; z-index: 70; border-radius: 24px; background: rgba(44,46,45,.86); backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%); padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start; text-align: left; box-shadow: 0 16px 40px rgba(0,0,0,.5); transform: translateY(-160%); transition: transform .5s cubic-bezier(.2,.9,.3,1); }
.push.show { transform: none; }
@media (min-width: 700px) { .push { top: 50px; } }
.push img { width: 38px; height: 38px; border-radius: 10px; background: #000; object-fit: contain; padding: 9px 5px; flex: none; }
.push .t { flex: 1; min-width: 0; }
.push .row { display: flex; justify-content: space-between; font-size: 12px; color: var(--fg2); }
.push b { font-weight: 600; font-size: 14px; display: block; }
.push p { margin: 0; font-size: 14px; color: var(--fg); }

/* Booking, payment, check-in sheets */
.paycard { border-radius: 22px; padding: 18px; background: var(--s2); display: grid; gap: 10px; }
.line { display: flex; justify-content: space-between; color: var(--fg2); font-size: 14px; }
.line.total { color: var(--fg); font: 800 24px var(--display); border-top: 1px solid var(--hair); padding-top: 12px; }
.cardrow { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 18px; background: var(--s2); }
.cardrow .brand { width: 46px; height: 30px; border-radius: 6px; background: linear-gradient(135deg, #1a1f71, #2b55c2); color: #fff; font: 800 10px var(--display); display: grid; place-items: center; letter-spacing: .06em; }
.cardrow .t { flex: 1; }
.cardrow b { font-weight: 600; display: block; font-size: 15px; }
.cardrow small { color: var(--fg3); font-size: 12px; }
.cimetric { display: grid; gap: 8px; }
.cimetric .lab { display: flex; justify-content: space-between; align-items: baseline; }
.cimetric .lab b { font: 700 16px var(--display); }
.cimetric .lab small { color: var(--fg3); font-size: 12px; }
.scale5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.scale5 button { height: 46px; border-radius: 14px; background: var(--s2); font: 700 16px var(--display); }
.scale5 button[aria-pressed="true"] { background: var(--c); color: #0a0a0a; }
.wt { display: flex; align-items: center; gap: 10px; background: var(--s2); border-radius: 16px; padding: 0 16px; height: 56px; }
.wt input { background: none; border: 0; color: var(--fg); font: 800 24px var(--display); width: 100px; }
.wt input:focus { outline: none; }
.wt span { color: var(--fg3); }

.toast { position: absolute; left: 50%; top: 60px; transform: translateX(-50%); z-index: 60; background: var(--fg); color: #000; padding: 10px 18px; border-radius: 22px; font-size: 14px; font-weight: 500; white-space: nowrap; max-width: calc(100% - 40px); overflow: hidden; text-overflow: ellipsis; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
@media (prefers-reduced-motion: no-preference) { .fade { animation: fade .28s ease; } @keyframes fade { from { opacity: 0; transform: translateY(6px); } } }

/* ---- Refined system ----------------------------------------------------
   Labels are plain text with a colour dot, never pills. Related rows sit in
   one grouped list with hairline dividers. Calls to action are square-cornered
   and uppercase. The tab bar is flat. Kyle is mint with his monogram;
   KAI is violet with the orb. */
.card { border-radius: 16px; }
.chip { height: auto; padding: 0; border-radius: 0; background: none !important; gap: 6px; font-size: 13px; color: var(--fg2); }
.chip.glass { backdrop-filter: none; -webkit-backdrop-filter: none; border: 0; color: #fff; text-shadow: 0 1px 10px rgba(0,0,0,.7); }
.ex-meta { gap: 18px; }
.label-dot { display: inline-flex; align-items: center; gap: 7px; font: 700 11px var(--display); letter-spacing: .14em; text-transform: uppercase; }
.label-dot::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.hero { border-radius: 20px; }
.hero .tag { background: none; font: 700 11px var(--display); letter-spacing: .18em; text-transform: uppercase; }
.hero h2, .ex-title h1, .finish h1 { text-transform: uppercase; letter-spacing: -.01em; }
.play { border-radius: 16px; }
.pill-btn { border-radius: 14px; height: 54px; font: 800 13px var(--display); letter-spacing: .1em; text-transform: uppercase; }
.pill-btn svg { width: 18px; height: 18px; }
.timebtn { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 10px; background: rgba(0,0,0,.5); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); color: #fff; font: 700 13px var(--display); }
.timebtn svg { width: 15px; height: 15px; }
.tabbar { left: 0; right: 0; bottom: 0; height: calc(64px + env(safe-area-inset-bottom, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); border-radius: 0; border: 0; border-top: 1px solid var(--hair); background: rgba(8,9,9,.86); }
.tabbar .pip { top: 9px; }
.group { background: var(--s2); border-radius: 16px; overflow: hidden; display: grid; --inset: 68px; }
.group > * { background: none !important; border-radius: 0 !important; border: 0 !important; position: relative; }
.group > * + *::before { content: ""; position: absolute; top: 0; left: var(--inset); right: 0; height: 1px; background: var(--hair); }
.st { background: none !important; padding: 0 !important; display: inline-flex; align-items: center; gap: 6px; }
.st::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.cta { background: none !important; padding: 0; height: auto; margin-top: 8px; font: 700 12px var(--display); letter-spacing: .1em; text-transform: uppercase; gap: 4px; }
.cta::after { content: "→"; font-family: var(--body); }
.react { background: none; padding: 0 12px 0 0; height: 32px; }
.react.on { background: none; color: var(--violet); }
.drop { border-radius: 20px; }
.summary { gap: 18px; }
.seg { border-radius: 10px; padding: 3px; } .seg button { border-radius: 8px; height: 34px; }
.area { border-radius: 12px; } .daychips button { border-radius: 10px; }
.opt, .fopt, .goal { border-radius: 16px; } .tg { border-radius: 14px; }
.toast { border-radius: 12px; }
.sheet { border-radius: 26px 26px 0 0; }
.msg { border-radius: 20px; }
.mini, .stat { border-radius: 16px; }

/* Kyle and KAI */
.kd-av { width: 38px; height: 38px; border-radius: 50%; background: #050606; border: 1.5px solid var(--mint); display: grid; place-items: center; position: relative; flex: none; }
.kd-av img { width: 24px; height: auto; }
.kd-av .dot { position: absolute; bottom: -1px; right: -1px; top: auto; width: 10px; height: 10px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 0 2px var(--bg); }

// ---------------------------------------------------------------------------
// Coaching rules (mirrors the TypeScript rules engine)
// ---------------------------------------------------------------------------
function suggestLoad(ex) {
  const top = ex.reps[1];
  const hitAll = ex.last.reps.length >= ex.sets && ex.last.reps.every(r => r >= top);
  if (ex.inc > 0 && hitAll) return { load: ex.last.load + ex.inc, up: true,
    why: `You hit ${top} reps on every set at ${ex.last.load}kg last time, so the weight goes up.` };
  const short = ex.last.reps.filter(r => r < top).length;
  return { load: ex.last.load, up: false,
    why: ex.inc === 0 ? 'Bodyweight. Slow and controlled.' : `${short} set${short > 1 ? 's' : ''} fell short of ${top} last time. Hit ${top} on every set, then it goes up.` };
}
const exMinutes = (ex, sets) => ex.setup + (sets * 50 + (sets - 1) * ex.rest) / 60 + 1;
function fitToTime(minutes) {
  let plan = WORKOUT.exercises.map(ex => ({ ex, sets: ex.sets }));
  const total = () => plan.reduce((m, p) => m + exMinutes(p.ex, p.sets), 0) + 8;
  const steps = [
    () => { const c = [...plan].reverse().find(p => p.ex.priority === 'first_to_cut'); if (!c) return false; plan = plan.filter(p => p !== c); return true; },
    () => { const c = plan.find(p => p.ex.priority === 'keep_if_time' && p.sets > 2); if (!c) return false; c.sets = 2; return true; },
    () => { const c = [...plan].reverse().find(p => p.ex.priority === 'keep_if_time'); if (!c) return false; plan = plan.filter(p => p !== c); return true; },
    () => { const c = plan.find(p => p.ex.priority === 'must_keep' && p.sets > 2); if (!c) return false; c.sets = 2; return true; }
  ];
  for (const step of steps) while (total() > minutes && step()) {}
  return { plan, minutes: Math.round(total()) };
}

    S.logs[ex.id] = Array.from({ length: n }, (_, i) => cur[i] || { load: s.load, reps: '', done: false });
  }
  return S.logs[ex.id];
}

function lineChart(pts, color, w = 320, h = 120) {
  const min = Math.min(...pts), max = Math.max(...pts), pad = 8;

  const last = xy[xy.length - 1];
  const id = 'g' + color.replace(/\W/g, '');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".35"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    ${[0.25, 0.5, 0.75].map(f => `<line x1="0" x2="${w}" y1="${h * f}" y2="${h * f}" stroke="rgba(255,255,255,.05)"/>`).join('')}
    <path d="${d} L${last[0]} ${h} L${xy[0][0]} ${h} Z" fill="url(#${id})"/>

}

function liftChart(rows) {
  const W = 320, H = 180, L = 34, B = 24, T = 26, R = 16;
  const v = rows.map(x => x[1]), lo = Math.floor(Math.min(...v) / 10) * 10, hi = Math.ceil(Math.max(...v) / 10) * 10 || lo + 10;
  const X = i => L + i * (W - L - R) / (rows.length - 1), Y = n => T + (hi - n) / (hi - lo || 1) * (H - T - B);
  const ticks = [lo, (lo + hi) / 2, hi];
  const d = rows.map((x, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)} ${Y(x[1]).toFixed(1)}`).join(' ');
  return `<svg class="chart2" viewBox="0 0 ${W} ${H}" role="img" aria-label="Top set weight each session">
    ${ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${Y(t)}" y2="${Y(t)}" stroke="rgba(255,255,255,.07)"/><text x="${L - 6}" y="${Y(t) + 4}" text-anchor="end" fill="var(--fg3)" font-size="10" font-family="Poppins">${t}</text>`).join('')}
    <path d="${d}" fill="none" stroke="var(--mint)" stroke-width="2.5" stroke-linejoin="round"/>
    ${rows.map((x, i) => `<circle cx="${X(i)}" cy="${Y(x[1])}" r="${i === rows.length - 1 ? 5.5 : 3.5}" fill="${i === rows.length - 1 ? 'var(--mint)' : '#151716'}" stroke="var(--mint)" stroke-width="2"/>`).join('')}
    ${[rows.length - 1].map(i => `<text x="${X(i)}" y="${Y(rows[i][1]) - 11}" text-anchor="middle" fill="var(--fg)" font-size="11" font-weight="700" font-family="Montserrat">${rows[i][1]}</text>`).join('')}
    ${[0, Math.floor((rows.length - 1) / 2), rows.length - 1].map(i => `<text x="${X(i)}" y="${H - 6}" text-anchor="${i === 0 ? 'start' : i === rows.length - 1 ? 'end' : 'middle'}" fill="var(--fg3)" font-size="10" font-family="Poppins">${rows[i][0]}</text>`).join('')}
  </svg>`;
}

    { id: 'q1', by: 'kyle', when: 'Mon', cat: 'questions', pinned: true, title: 'Question of the week', body: 'What\'s one thing that has made training easier for you this month?', likes: 8,
      cmts: [['priya', 'Laying my gym kit out the night before!'], ['mark', 'Training with Jen. No skipping when someone\'s waiting for you 😂'], ['ellie', 'Shorter 30 minute sessions on busy days']] },
    { id: 'p1', by: 'priya', when: '2 h', body: '10k done this morning! 52:40, a new PB 🎉 Legs held up so much better thanks to the strength work.', likes: 21, cmts: [['kyle', 'Massive, Priya! That\'s 3 minutes faster than June.']] },
    { id: 't1', by: 'kyle', when: 'Wed', cat: 'tips', title: 'Front-load your protein', body: 'Aim for 30g at breakfast. It keeps you full until lunch and makes your daily target far easier to hit.', likes: 14, cmts: [] },

}
function postHTML(p) {
  const c = S.comm, cat = p.cat && CATS.find(x => x[0] === p.cat), open = c.open[p.id], liked = c.liked[p.id];
  return `<article class="post ${p.pinned ? 'pinned' : ''}">
    <div class="by">${avatarP(p.by)}<span class="t"><b>${PEOPLE[p.by][0]}</b>${p.by === 'kyle' ? '<span class="coachtag">Coach</span>' : ''}<small>${p.when}${p.pinned ? ' · Pinned' : ''}</small></span>
      ${cat ? `<span class="label-dot" style="color:${cat[3]}">${cat[1]}</span>` : ''}</div>
    ${p.title ? `<h3>${p.title}</h3>` : ''}<p>${p.body}</p>
    ${p.imgs ? `<div class="strip3">${p.imgs.map(i => `<img src="assets/${i}.jpg" alt="">`).join('')}</div>` : ''}
    ${p.board ? `<div class="board">${p.board.map(([n, v], i) => `<div><span>${i + 1}. ${n}</span><b class="num">${v} avg</b></div>`).join('')}</div><button class="pill-btn dark" data-toast="You've joined. Steps count from Sunday">Join the challenge</button>` : ''}
    <div class="acts"><button class="${liked ? 'on' : ''}" data-plike="${p.id}">${ic('heart')}<span class="num">${p.likes + (liked ? 1 : 0)}</span></button>
      <button data-popen="${p.id}">${ic('chat')}<span class="num">${p.cmts.length}</span> ${p.cat === 'questions' ? 'Answers' : 'Comments'}</button></div>
    ${open ? `<div class="cmts">${p.cmts.map(([w, t]) => `<div class="cmt">${avatarP(w).replace('class="av"', 'class="av"').replace('class="kd-av"', 'class="kd-av" style="width:28px;height:28px"')}<span><b>${PEOPLE[w][0]}</b>${t}</span></div>`).join('')}
      <div class="reply"><input id="rp-${p.id}" placeholder="${p.cat === 'questions' ? 'Add your answer' : 'Write a comment'}" aria-label="Reply"><button class="addbtn" style="color:var(--mint);background:rgba(126,213,151,.1);box-shadow:inset 0 0 0 1px rgba(126,213,151,.45)" data-preply="${p.id}" aria-label="Send">${ic('send')}</button></div></div>` : ''}
  </article>`;
}
function vCommunity() {
  const c = S.comm;

  const head = `<div class="greet" style="padding-top:6px"><div class="eyebrow">KDPT group · 35 members</div><h1>Community</h1></div>
    <div class="seg" style="grid-template-columns:1fr 1fr" role="tablist">${[['feed', 'Feed'], ['library', 'Library']].map(([k, l]) => `<button role="tab" class="${c.tab === k ? 'on' : ''}" data-ctab="${k}">${l}</button>`).join('')}</div>`;
  if (c.tab === 'feed') return `<div class="page fade">${head}
    <div class="comp">${avatarP('sarah')}<input id="newpost" placeholder="Share something with the group" aria-label="New post"><button data-toast="Photo picker opens here" aria-label="Add photo" style="color:var(--fg2)">${ic('camera')}</button><button class="postbtn" data-newpost>Post</button></div>
    ${c.posts.map(postHTML).join('')}
  </div>`;
  if (!c.cat) return `<div class="page fade">${head}
    <div class="cats">${CATS.map(([k, l, i, col, sub], n) => `<button class="cat ${n === 4 ? 'wide' : ''}" data-cat="${k}"><span class="li" style="color:${col}">${ic(i)}</span><span><b>${l}</b><small>${LIB[k].length} · ${sub}</small></span></button>`).join('')}</div>
  </div>`;
  const [k, l, i, col] = CATS.find(x => x[0] === c.cat);
  const rows = c.cat === 'meals'
    ? LIB.meals.map(([img, n, w]) => { const f = FOODS.find(x => x.img === img); return `<div class="food"><img src="assets/${img}.jpg" alt=""><span class="t"><b>${n}</b><small class="num">${w}${f ? ` · ${f.kcal} kcal · ${f.P}g protein` : ''}</small></span>${f ? `<button class="addbtn" data-libfood="${f.id}" aria-label="Add to Fuel">${ic('plus')}</button>` : ''}</div>`; }).join('')
    : LIB[c.cat].map(r => `<button class="optrow" data-toast="${r[1]}"><span class="li" style="color:${col}">${ic(i)}</span><span class="t"><b>${r[1]}</b><small>${r[0]}${r[2] ? ' · ' + r[2] : ''}</small></span><span class="chev">${ic('right')}</span></button>`).join('');
  return `<div class="page fade">${head}
    <button class="switchto" style="color:var(--fg2)" data-cat="">${ic('back').replace('class="ic"', 'class="ic" style="width:16px;height:16px"')} All categories</button>
    <div style="display:flex;gap:12px;align-items:center"><span class="li" style="color:${col}">${ic(i)}</span><h2 style="font-size:22px;font-weight:800">${l}</h2></div>
    <div class="group" style="--inset:${c.cat === 'meals' ? 66 : 68}px">${rows}</div>
  </div>`;
}

const MOODS = [['Rough', 'var(--coral)'], ['Low', 'var(--amber)'], ['Okay', '#c9cfcb'], ['Good', 'var(--sky)'], ['Great', 'var(--mint)']];
const WEEK = [['sleep', 'Sleep', 'moon', 'var(--violet)', 'Poor', 'Great'], ['energy', 'Energy', 'bolt', 'var(--mint)', 'Flat', 'Buzzing'],
  ['stress', 'Stress', 'flame', 'var(--coral)', 'Calm', 'Maxed out'], ['food', 'Food', 'fuel', 'var(--amber)', 'Off track', 'Spot on'],
  ['motivation', 'Motivation', 'trophy', 'var(--sky)', 'Low', 'Fired up']];
const WINS = [['clothes', 'Clothes fit better', 'shirt', 'var(--mint)'], ['energy', 'More energy', 'bolt', 'var(--amber)'], ['sleep', 'Sleeping better', 'moon', 'var(--violet)'],
  ['strength', 'Lifting heavier', 'train', 'var(--mint)'], ['confident', 'Feeling confident', 'heart', 'var(--coral)'], ['bloat', 'Less bloated', 'drop', 'var(--sky)'],
  ['mood', 'Better mood', 'sun', 'var(--amber)'], ['plan', 'Stuck to my plan', 'clip', 'var(--violet)']];
const SUPPORT = [['same', 'Keep things as they are', 'check', 'var(--mint)'], ['accountability', 'More accountability', 'bell', 'var(--amber)'],
  ['food', 'Help with food', 'fuel', 'var(--amber)'], ['training', 'Change my training', 'train', 'var(--mint)'],
  ['call', 'A call with my coach', 'chat', 'var(--sky)'], ['pep', 'Just a bit of encouragement', 'heart', 'var(--coral)']];

function vCheckin() {
  const c = S.ci;
  if (c.step === 5) {
    const wins = WINS.filter(w => c.wins[w[0]]), sup = SUPPORT.filter(x => c.support[x[0]]);
    return `<div class="ci-done fade"><span class="orbok">${ic('check')}</span>
      <div><h1>Check-in sent</h1><p class="lead" style="margin-top:8px">Your coach will reply before your next session. Momentum updated.</p></div>
      <div class="group ci-sum" style="--inset:62px">
        <div class="optrow"><span class="li" style="color:${MOODS[c.mood][1]}!important">${ic('sun')}</span><span class="t"><b>Feeling ${MOODS[c.mood][0].toLowerCase()}</b><small>${c.words ? c.words.slice(0, 60) : 'No note this week'}</small></span></div>
        <div class="optrow"><span class="li" style="color:var(--mint)">${ic('trophy')}</span><span class="t"><b>${wins.length} win${wins.length === 1 ? '' : 's'} beyond the scale</b><small>${wins.map(w => w[1]).join(' · ') || 'Next week'}</small></span></div>
        <div class="optrow"><span class="li" style="color:var(--sky)">${ic('chat')}</span><span class="t"><b>Support</b><small>${sup.map(x => x[1]).join(' · ') || 'Nothing extra'}</small></span></div>
      </div>
      <button class="pill-btn white" style="width:100%" data-go="home">Done</button></div>`;
  }
  const titles = ['', 'How are you feeling?', 'How was your week?', 'Wins beyond the scale', 'How can your coach help?'];
  let body = '';
  if (c.step === 1) body = `
    <div><div class="mind" id="mind" style="--c:${MOODS[c.mood][1]}"></div><b class="mindword" id="mindword">${MOODS[c.mood][0]}</b></div>
    <div><input type="range" class="moodrange" id="moodr" min="0" max="4" step="1" value="${c.mood}" aria-label="How you're feeling"><div class="moodlabels">${MOODS.map(m => `<span>${m[0]}</span>`).join('')}</div></div>
    <div><div class="eyebrow" style="margin-bottom:10px">In your own words</div>
      <textarea class="words" id="ciwords" placeholder="What's been going on? Work, family, how training felt…">${c.words}</textarea></div>`;
  if (c.step === 2) body = `
    ${WEEK.map(([k, l, icon, col, lo, hi]) => `<div class="cimetric"><div class="lab"><b style="display:flex;align-items:center;gap:10px"><span class="li" style="color:${col};width:32px!important;height:32px!important;border-radius:9px!important">${ic(icon)}</span>${l}</b><small>${lo} → ${hi}</small></div>
      <div class="scale5">${[1, 2, 3, 4, 5].map(v => `<button class="num ${v < c[k] ? 'lit' : ''}" style="--c:${col}" aria-pressed="${c[k] === v}" data-cim="${k}" data-v="${v}">${v}</button>`).join('')}</div></div>`).join('')}
    <div><div class="eyebrow" style="margin-bottom:10px">Any aches or niggles?</div><div class="daychips">${['None', 'Knee', 'Back', 'Shoulder', 'Hip', 'Other'].map(a => `<button aria-pressed="${c.aches === a}" data-ache="${a}">${a}</button>`).join('')}</div></div>`;
  if (c.step === 3) body = `
    <div class="quotecard"><p>Would you rather lose 5 lbs, or look like you've lost 5 lbs?</p><small><img src="assets/kd-mark.png" alt="">It's not about the number on the scales</small></div>
    <div><div class="eyebrow" style="margin-bottom:10px">What's better this week?</div>
      <div class="wins">${WINS.map(([k, l, icon, col]) => `<button class="win" aria-pressed="${!!c.wins[k]}" data-win="${k}"><span class="wintile" style="color:${col}">${ic(icon)}</span>${l}</button>`).join('')}</div></div>
    <div><div class="eyebrow" style="margin-bottom:10px">Optional</div>
      <div class="group" style="--inset:68px">
        <button class="optrow" data-photo><span class="li" style="color:#c9cfcb">${ic('camera')}</span><span class="t"><b>Progress photo</b><small>Private to you and your coach</small></span><span class="add">${c.photo ? 'Added ✓' : 'Add'}</span></button>
        <div><button class="optrow" data-measure><span class="li" style="color:#c9cfcb">${ic('weight')}</span><span class="t"><b>Measurements or weight</b><small>Only if you want to. Once a month is plenty</small></span><span class="add">${c.measure ? 'Hide' : 'Add'}</span></button>
          ${c.measure ? `<div class="meas"><label>Waist<input id="ciwaist" inputmode="decimal" placeholder="– cm" value="${c.waist}"></label><label>Weight<input id="ciweight" inputmode="decimal" placeholder="– kg" value="${c.weight}"></label></div>` : ''}</div>
      </div></div>`;
  if (c.step === 4) body = `
    <div class="group" style="--inset:64px">${SUPPORT.map(([k, l, icon, col]) => `<button class="sup" aria-pressed="${!!c.support[k]}" data-sup="${k}"><span class="suptile" style="color:${col}">${ic(icon)}</span><span class="t">${l}</span><span class="tick">${ic('check')}</span></button>`).join('')}</div>
    <div><div class="eyebrow" style="margin-bottom:10px">Anything else your coach should know?</div>
      <textarea class="words" id="cinote" placeholder="Holidays coming up, a new job, a niggle you're unsure about…">${c.note}</textarea></div>`;
  return `<div class="onb fade ci-wrap">
    <div class="onb-top"><button class="round" style="background:var(--s2)" data-ci="${c.step === 1 ? 'close' : 'back'}" aria-label="${c.step === 1 ? 'Close' : 'Back'}">${ic(c.step === 1 ? 'close' : 'back')}</button><div class="onb-prog">${[1, 2, 3, 4].map(i => `<i class="${i <= c.step ? 'on' : ''}"></i>`).join('')}</div></div>
    <div class="onb-step"><div><div class="eyebrow" style="color:var(--violet)">${freqInfo().label} check-in</div><h1 style="margin-top:6px">${titles[c.step]}</h1></div>${body}</div></div>`;
}

// Sarah's regular slots for November: Mondays and Thursdays at 7:00.
const NOV = [['MON', 2, '7:00'], ['THU', 5, '7:00'], ['MON', 9, '7:00'], ['THU', 12, '7:00'], ['MON', 16, '7:00'], ['THU', 19, '7:00'], ['MON', 23, '7:00'], ['THU', 26, '7:00']];

// Kyle's working hours: the gym opens at 6:30, Wednesday is a half day, no
// weekends. Clients can only offer times inside these.
const HOURS = { Mon: [6.5, 20], Tue: [6.5, 20], Wed: [6.5, 13], Thu: [6.5, 20], Fri: [6.5, 20], Sat: null, Sun: null };
const hm = h => `${Math.floor(h)}:${h % 1 ? '30' : '00'}`;
function availHTML() {
  const a = S.avail;
  if (a.sent) return `<div class="sent"><span class="ok" style="background:var(--sky);color:#03121f">${ic('check')}</span><h3>Sent to Kyle</h3><p>Kyle will fit your sessions into these times and confirm them. You'll get the exact days and times in a notification.</p></div><button class="pill-btn white" data-close>Done</button>`;
  const steps = (lo, hi) => { const o = []; for (let h = lo; h <= hi; h += 0.5) o.push(h); return o; };
  return `<div><h3>When can you train in November?</h3><div class="sub">Tick the days that work and give a rough window. Kyle places your 8 sessions and confirms them.</div></div>
    <div class="group" style="--inset:14px">${Object.entries(HOURS).map(([d, hrs]) => { const w = a.days[d]; return !hrs
      ? `<div class="avrow off"><b>${d}</b><span class="t">Kyle doesn't work ${d === 'Sat' ? 'Saturdays' : 'Sundays'}</span></div>`
      : `<div class="avrow"><b>${d}</b><span class="t">${w ? `<select id="avf-${d}" data-avk="${d}" data-ix="0" aria-label="${d} from">${steps(hrs[0], hrs[1] - 1).map(h => `<option value="${h}" ${h === w[0] ? 'selected' : ''}>${hm(h)}</option>`).join('')}</select> to
          <select id="avt-${d}" data-avk="${d}" data-ix="1" aria-label="${d} until">${steps(hrs[0] + 1, hrs[1]).map(h => `<option value="${h}" ${h === w[1] ? 'selected' : ''}>${hm(h)}</option>`).join('')}</select>`
        : `<small>Kyle's hours ${hm(hrs[0])}–${hm(hrs[1])}</small>`}</span>
        <button class="sw" role="switch" aria-checked="${!!w}" data-avday="${d}" aria-label="${d}"></button></div>`; }).join('')}</div>
    <label class="search" style="height:auto;padding:12px 14px"><input id="avnote" placeholder="Anything else? e.g. not the week of the 16th" value="${a.note || ''}" aria-label="Note for Kyle"></label>
    <button class="pill-btn mint" data-availsend>Send to Kyle</button>`;
}
