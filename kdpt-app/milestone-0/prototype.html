<title>KDPT App Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Poppins:wght@400;500;600&display=swap">
<style>
/* Layout: the client app alone. On a phone it fills the screen; on a desktop it
   sits in a device frame. Dark-only by design. Mint is the brand and training
   colour; food, check-ins and alerts each get their own hue so they stand apart. */
:root {
  --bg: #000000;
  --s1: #0d0e0e;
  --s2: #151716;
  --s3: #1e211f;
  --hair: rgba(255,255,255,0.08);
  --fg: #f5f7f6;
  --fg2: #a2a8a5;
  --fg3: #676d6a;
  --mint: #7ed597;
  --mint-ink: #03140a;
  --amber: #ffb45e;
  --violet: #a99bff;
  --sky: #6ec6ff;
  --coral: #ff6b5e;
  --display: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
  --body: 'Poppins', 'Helvetica Neue', Arial, sans-serif;
  --gut: max(20px, env(safe-area-inset-left, 0px));
  --gut-r: max(20px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.45; }
h1, h2, h3, .d { font-family: var(--display); margin: 0; letter-spacing: -0.02em; text-wrap: balance; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--mint); outline-offset: 3px; border-radius: 12px; }
svg { display: block; }
.num { font-variant-numeric: tabular-nums; }

/* ---- Device ------------------------------------------------------------ */
.device { position: relative; height: 100%; overflow: hidden; background: var(--bg); }
.screen { height: 100%; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
.screen::-webkit-scrollbar { display: none; }
.statusbar { display: none; }
@media (min-width: 700px) {
  body { display: grid; place-items: center; padding-block: 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
         background: radial-gradient(60% 50% at 50% 40%, #0f1a13 0%, #000 70%); min-height: 100%; height: auto; }
  .device { width: 393px; height: 852px; border-radius: 54px; box-shadow: 0 0 0 11px #111312, 0 0 0 12px #2a2d2b, 0 40px 120px rgba(0,0,0,.8); }
  .statusbar { display: flex; position: absolute; inset: 0 0 auto; height: 50px; padding: 16px 32px 0; justify-content: space-between; font: 600 15px var(--display); z-index: 30; pointer-events: none; }
  .statusbar i { width: 120px; height: 34px; border-radius: 20px; background: #000; position: absolute; left: 50%; top: 11px; transform: translateX(-50%); }
  .screen { padding-top: 34px; }
}
.page { padding: 12px var(--gut-r) 120px var(--gut); display: grid; gap: 22px; }
.page.flush { padding-top: 0; }

/* ---- Tab bar ----------------------------------------------------------- */
.tabbar { position: absolute; left: 12px; right: 12px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); height: 68px; border-radius: 26px;
  background: rgba(22,24,23,.78); backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%);
  border: 1px solid var(--hair); display: grid; grid-template-columns: repeat(5, 1fr); z-index: 20; }
.tabbar button { display: grid; place-items: center; align-content: center; gap: 4px; color: var(--fg3); position: relative; transition: color .2s; }
.tabbar button span { font-size: 10px; font-weight: 500; letter-spacing: .02em; }
.tabbar button.on { color: var(--fg); }
.tabbar button.on svg { color: var(--mint); }
.tabbar .pip { position: absolute; top: 12px; right: calc(50% - 16px); width: 8px; height: 8px; border-radius: 50%; background: var(--coral); box-shadow: 0 0 0 2px #161817; }
.tabbar[hidden] { display: none; }

/* ---- Shared bits ------------------------------------------------------- */
.ic { width: 22px; height: 22px; }
.glass { background: rgba(255,255,255,.1); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.12); }
.round { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 15px; font-size: 13px; font-weight: 500; }
.chip svg { width: 15px; height: 15px; }
.eyebrow { font: 600 11px var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--fg3); }
.sec-head { display: flex; justify-content: space-between; align-items: baseline; }
.sec-head h2 { font-size: 20px; font-weight: 700; }
.sec-head button { font-size: 14px; color: var(--fg2); }
.card { background: var(--s2); border-radius: 24px; }
.pill-btn { height: 56px; border-radius: 28px; padding: 0 26px; font: 700 16px var(--display); display: inline-flex; align-items: center; justify-content: center; gap: 10px; letter-spacing: -.01em; }
.pill-btn.mint { background: var(--mint); color: var(--mint-ink); }
.pill-btn.white { background: var(--fg); color: #000; }
.pill-btn.dark { background: var(--s3); color: var(--fg); }
.avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font: 700 14px var(--display); }

/* ---- Home -------------------------------------------------------------- */
.topbar { display: flex; justify-content: space-between; align-items: center; padding-top: 6px; }
.topbar img { height: 22px; width: auto; }
.topbar .avatar { background: linear-gradient(135deg, #2c3a31, #1a201c); color: var(--mint); width: 38px; height: 38px; font-size: 13px; }
.greet .eyebrow { margin-bottom: 4px; }
.greet h1 { font-size: 32px; font-weight: 800; line-height: 1.05; }

.hero { position: relative; height: 340px; border-radius: 30px; overflow: hidden; display: flex; align-items: flex-end; text-align: left; width: 100%; }
.hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 30%, rgba(0,0,0,.55) 58%, rgba(0,0,0,.92) 100%); }
.hero .in { position: relative; z-index: 1; padding: 22px; width: 100%; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.hero .tag { position: absolute; top: 18px; left: 18px; z-index: 1; background: rgba(0,0,0,.45); }
.hero h2 { font-size: 30px; font-weight: 800; line-height: 1.02; margin-top: 6px; }
.hero .meta { display: flex; gap: 14px; margin-top: 10px; color: rgba(255,255,255,.78); font-size: 14px; }
.hero .meta span { display: inline-flex; align-items: center; gap: 6px; }
.hero .meta svg { width: 16px; height: 16px; }
.play { width: 64px; height: 64px; border-radius: 50%; background: var(--mint); color: var(--mint-ink); display: grid; place-items: center; flex: none; box-shadow: 0 10px 30px rgba(126,213,151,.35); }
.play svg { width: 26px; height: 26px; margin-left: 3px; }

.week-card { padding: 20px; display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 20px; align-items: center; }
.legend { display: grid; gap: 14px; }
.legend div { display: grid; grid-template-columns: 30px minmax(0,1fr); gap: 10px; align-items: center; }
.legend .li { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; }
.legend .li svg { width: 16px; height: 16px; }
.legend b { font: 700 18px var(--display); display: block; line-height: 1.1; }
.legend small { color: var(--fg3); font-size: 12px; }

.strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.strip div { display: grid; justify-items: center; gap: 8px; font-size: 12px; color: var(--fg3); }
.strip i { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font: 600 13px var(--display); font-style: normal; color: var(--fg2); background: var(--s2); }
.strip i svg { width: 16px; height: 16px; }
.strip .done i { background: var(--mint); color: var(--mint-ink); }
.strip .pt i { background: rgba(110,198,255,.16); color: var(--sky); }
.strip .now i { background: var(--fg); color: #000; }
.strip .now { color: var(--fg); }

.actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.act { display: grid; justify-items: center; gap: 8px; font-size: 12px; color: var(--fg2); }
.act i { width: 60px; height: 60px; border-radius: 20px; display: grid; place-items: center; }
.act i svg { width: 24px; height: 24px; }

.session { display: flex; align-items: center; gap: 16px; padding: 14px; width: 100%; text-align: left; }
.datebox { width: 58px; height: 62px; border-radius: 16px; background: rgba(110,198,255,.12); color: var(--sky); display: grid; place-items: center; align-content: center; flex: none; }
.datebox small { font: 700 10px var(--display); letter-spacing: .12em; }
.datebox b { font: 800 24px var(--display); line-height: 1; }
.session .t { flex: 1; min-width: 0; }
.session .t b { display: block; font: 700 17px var(--display); }
.session .t span { color: var(--fg3); font-size: 13px; display: inline-flex; gap: 5px; align-items: center; }
.session .t span svg { width: 14px; height: 14px; }
.chev { color: var(--fg3); }

.note { padding: 18px; display: flex; gap: 14px; align-items: flex-start; width: 100%; text-align: left; }
.note img.mark { width: 40px; height: 40px; border-radius: 50%; background: #0b0c0c; object-fit: contain; padding: 9px 6px; flex: none; border: 1px solid var(--hair); }
.note p { margin: 2px 0 0; font-size: 15px; color: var(--fg); }
.note small { color: var(--fg3); font-size: 12px; }

/* ---- Train ------------------------------------------------------------- */
.block { padding: 20px; display: grid; gap: 14px; }
.segs { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
.segs i { height: 6px; border-radius: 3px; background: var(--s3); }
.segs i.on { background: var(--mint); }
.segs i.cur { background: linear-gradient(90deg, var(--mint) 50%, var(--s3) 50%); }
.wrow { display: flex; align-items: center; gap: 14px; padding: 14px; width: 100%; text-align: left; }
.wrow .tile { width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; flex: none; background: var(--s3); color: var(--fg2); }
.wrow .tile svg { width: 24px; height: 24px; }
.wrow.today .tile { background: var(--mint); color: var(--mint-ink); }
.wrow.done .tile { background: rgba(126,213,151,.14); color: var(--mint); }
.wrow .t { flex: 1; min-width: 0; }
.wrow .t b { font: 700 16px var(--display); display: block; }
.wrow .t span { font-size: 13px; color: var(--fg3); }

/* ---- Workout ----------------------------------------------------------- */
.media { position: relative; height: 330px; overflow: hidden; }
.media img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 28%; }
.media::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.45) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,0) 60%, #000 100%); }
.media .ctl { position: absolute; z-index: 2; top: 14px; left: var(--gut); right: var(--gut-r); display: flex; justify-content: space-between; align-items: center; }
@media (min-width: 700px) { .media .ctl { top: 50px; } }
.media .ctl .chip { color: #fff; }
.media .dots { display: flex; gap: 5px; }
.media .dots i { width: 6px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.35); transition: width .3s; }
.media .dots i.on { width: 20px; background: #fff; }
.media .dots i.done { background: var(--mint); }
.media .playing { position: absolute; z-index: 2; left: var(--gut); bottom: 18px; color: rgba(255,255,255,.8); }
.ex-title h1 { font-size: 30px; font-weight: 800; line-height: 1.05; }
.ex-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.ex-meta .chip { background: var(--s2); color: var(--fg2); }
.target { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 22px; width: 100%; text-align: left; }
.target.up { background: linear-gradient(120deg, rgba(126,213,151,.2), rgba(126,213,151,.06)); }
.target.hold { background: var(--s2); }
.target .arrow { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; flex: none; }
.target.up .arrow { background: var(--mint); color: var(--mint-ink); }
.target.hold .arrow { background: var(--s3); color: var(--fg2); }
.target b { font: 800 24px var(--display); display: block; line-height: 1.1; }
.target small { color: var(--fg2); font-size: 13px; }
.target .why { margin-left: auto; color: var(--fg3); }
.why-text { font-size: 14px; color: var(--fg2); margin: -10px 4px 0; }

.sets { display: grid; gap: 10px; }
.setrow { display: grid; grid-template-columns: 36px minmax(0,1fr) minmax(0,1fr) 60px; align-items: center; gap: 10px; background: var(--s1); border: 1px solid var(--hair); border-radius: 22px; padding: 10px 10px 10px 12px; transition: background .25s, border-color .25s; }
.setrow .n { width: 32px; height: 32px; border-radius: 50%; background: var(--s3); display: grid; place-items: center; font: 700 13px var(--display); color: var(--fg2); }
.val { display: grid; }
.val input { background: none; border: 0; color: var(--fg); font: 800 26px var(--display); width: 100%; padding: 0; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.val input:focus { outline: none; color: var(--mint); }
.val input::placeholder { color: var(--fg3); }
.val small { font-size: 11px; color: var(--fg3); letter-spacing: .04em; }
.tick { width: 56px; height: 56px; border-radius: 50%; border: 2px solid var(--s3); display: grid; place-items: center; color: var(--fg3); transition: all .2s; }
.tick svg { width: 26px; height: 26px; }
.setrow.done { background: rgba(126,213,151,.08); border-color: rgba(126,213,151,.25); }
.setrow.done .tick { background: var(--mint); border-color: var(--mint); color: var(--mint-ink); }
.setrow.done .n { background: rgba(126,213,151,.18); color: var(--mint); }
@media (prefers-reduced-motion: no-preference) { .setrow.done .tick { animation: pop .35s ease; } @keyframes pop { 50% { transform: scale(1.12); } } }

.dock { position: absolute; left: 0; right: 0; bottom: 0; z-index: 15; padding: 14px var(--gut-r) calc(20px + env(safe-area-inset-bottom, 0px)) var(--gut);
  background: linear-gradient(180deg, rgba(0,0,0,0), #000 35%); display: flex; gap: 10px; align-items: center; }
.dock .round { width: 56px; height: 56px; background: var(--s2); border: 1px solid var(--hair); }
.dock .round.pain { color: var(--coral); }
.dock .pill-btn { flex: 1; }

/* ---- Sheets & overlays ------------------------------------------------- */
.scrim { position: absolute; inset: 0; z-index: 40; background: rgba(0,0,0,.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: flex; align-items: flex-end; }
.sheet { width: 100%; background: var(--s1); border-top: 1px solid var(--hair); border-radius: 34px 34px 0 0; padding: 12px var(--gut-r) calc(28px + env(safe-area-inset-bottom, 0px)) var(--gut); display: grid; gap: 20px; max-height: 92%; overflow-y: auto; }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .32s cubic-bezier(.2,.9,.3,1); } @keyframes up { from { transform: translateY(40px); opacity: .4; } } }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--s3); margin: 0 auto; }
.sheet h3 { font-size: 24px; font-weight: 800; }
.sheet .sub { color: var(--fg2); font-size: 14px; margin-top: 4px; }
.opts { display: grid; gap: 10px; }
.opt { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 20px; background: var(--s2); border: 1.5px solid transparent; text-align: left; width: 100%; }
.opt .tile { width: 48px; height: 48px; border-radius: 14px; background: var(--s3); display: grid; place-items: center; flex: none; color: var(--fg2); }
.opt b { font: 700 16px var(--display); display: block; }
.opt span { font-size: 13px; color: var(--fg3); }
.opt[aria-pressed="true"] { border-color: var(--fg); }

.durs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.dur { aspect-ratio: 1; max-width: 100%; border-radius: 50%; background: var(--s2); display: grid; place-items: center; align-content: center; border: 2px solid transparent; }
.dur b { font: 800 24px var(--display); line-height: 1; }
.dur small { font-size: 11px; color: var(--fg3); }
.dur[aria-pressed="true"] { background: var(--fg); color: #000; }
.dur[aria-pressed="true"] small { color: #444; }
.cutlist { display: grid; gap: 8px; }
.cutlist div { display: flex; justify-content: space-between; align-items: center; font-size: 15px; padding: 10px 14px; border-radius: 14px; background: var(--s2); }
.cutlist div.cut { background: none; color: var(--fg3); text-decoration: line-through; }
.cutlist div.trim span { color: var(--amber); }
.cutlist span { color: var(--fg3); font-size: 13px; font-variant-numeric: tabular-nums; text-decoration: none; }

.areas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.area { height: 52px; border-radius: 16px; background: var(--s2); font-weight: 500; font-size: 14px; border: 1.5px solid transparent; }
.area[aria-pressed="true"] { border-color: var(--coral); color: var(--coral); background: rgba(255,107,94,.1); }
.sev { display: grid; gap: 12px; }
.sev .big { display: flex; align-items: baseline; gap: 10px; }
.sev .big b { font: 800 48px var(--display); line-height: 1; }
.sev .big span { color: var(--fg2); }
.sev input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 10px; border-radius: 5px; background: linear-gradient(90deg, var(--mint), var(--amber) 55%, var(--coral)); }
.sev input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; border-radius: 50%; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.5); }
.sev input[type=range]::-moz-range-thumb { width: 30px; height: 30px; border-radius: 50%; background: #fff; border: 0; }
.tri { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tri button { border-radius: 20px; background: var(--s2); padding: 16px 8px; display: grid; justify-items: center; gap: 8px; font-size: 13px; font-weight: 500; border: 1.5px solid transparent; }
.tri button svg { width: 24px; height: 24px; }
.tri button[aria-pressed="true"] { border-color: var(--fg); }
.sent { display: grid; justify-items: center; text-align: center; gap: 12px; padding: 12px 0; }
.sent .ok { width: 76px; height: 76px; border-radius: 50%; background: var(--mint); color: var(--mint-ink); display: grid; place-items: center; }
.sent .ok svg { width: 36px; height: 36px; }
.sent p { margin: 0; color: var(--fg2); font-size: 14px; max-width: 30ch; }

.rest { position: absolute; inset: 0; z-index: 45; background: rgba(0,0,0,.86); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); display: grid; place-items: center; align-content: center; gap: 28px; text-align: center; }
.rest .ringwrap { position: relative; width: 240px; height: 240px; }
.rest .ringwrap .c { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; }
.rest .ringwrap b { font: 800 60px var(--display); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.rest .ringwrap small { color: var(--fg2); }
.rest .nextup { color: var(--fg2); font-size: 15px; }
.rest .nextup b { color: var(--fg); font-weight: 600; }
.rest .btns { display: flex; gap: 12px; }

.finish { min-height: 100%; display: grid; align-content: center; justify-items: center; gap: 26px; padding: 60px var(--gut-r) 40px var(--gut); text-align: center; }
.finish h1 { font-size: 34px; font-weight: 800; }
.stats { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { background: var(--s2); border-radius: 22px; padding: 16px; text-align: left; display: grid; gap: 6px; }
.stat svg { width: 20px; height: 20px; }
.stat b { font: 800 26px var(--display); letter-spacing: -.02em; }
.stat small { color: var(--fg3); font-size: 12px; }

/* ---- Fuel -------------------------------------------------------------- */
.macro { padding: 20px; display: grid; grid-template-columns: 140px minmax(0,1fr); gap: 18px; align-items: center; }
.macro .lines { display: grid; gap: 14px; }
.macro .line small { color: var(--fg3); font-size: 12px; display: block; }
.macro .line b { font: 800 22px var(--display); }
.macro .line b span { font-size: 14px; color: var(--fg3); font-weight: 600; }
.bar { height: 6px; border-radius: 3px; background: var(--s3); margin-top: 6px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; }
.meals { display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; margin: 0 calc(-1 * var(--gut-r)) 0 calc(-1 * var(--gut)); padding: 0 var(--gut-r) 0 var(--gut); scroll-snap-type: x mandatory; scroll-padding-inline: var(--gut) var(--gut-r); }
.meals::-webkit-scrollbar { display: none; }
.meal { flex: none; width: 150px; scroll-snap-align: start; text-align: left; }
.meal .ph { width: 150px; height: 180px; border-radius: 22px; overflow: hidden; position: relative; background: var(--s2); display: grid; place-items: center; }
.meal .ph img { width: 100%; height: 100%; object-fit: cover; }
.meal .ph .ok { position: absolute; top: 10px; right: 10px; width: 26px; height: 26px; border-radius: 50%; background: var(--amber); color: #2a1600; display: grid; place-items: center; }
.meal .ph .ok svg { width: 14px; height: 14px; }
.meal b { display: block; font: 600 14px var(--display); margin-top: 10px; }
.meal small { color: var(--fg3); font-size: 12px; }
.meal.add .ph { border: 1.5px dashed rgba(255,180,94,.45); background: rgba(255,180,94,.06); color: var(--amber); }
.recipe { flex: none; width: 240px; scroll-snap-align: start; text-align: left; }
.recipe .ph { height: 150px; border-radius: 22px; overflow: hidden; }
.recipe .ph img { width: 100%; height: 100%; object-fit: cover; }
.recipe b { display: block; font: 700 15px var(--display); margin-top: 10px; }

const ic = (n, cls = 'ic', sw = 1.8) => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;

// A ring: pct 0..1, drawn clockwise from 12 o'clock.
function ring(size, stroke, pct, color, track = 'var(--s3)') {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r;
  return `<circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${track}" stroke-width="${stroke}"/>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - Math.min(pct, 1))}" transform="rotate(-90 ${size / 2} ${size / 2})"/>`;
}

// Sample data (invented for testing)
// ---------------------------------------------------------------------------
const WORKOUT = {

    { id: 'cr',  name: 'Calf Raise',         sets: 2, reps: [15, 20], rest: 60,  inc: 5,   priority: 'first_to_cut', setup: 0.5, kit: 'machine',
      last: { load: 50, reps: [20, 18] }, alts: [] },
    { id: 'db',  name: 'Dead Bug',           sets: 2, reps: [10, 10], rest: 45,  inc: 0,   priority: 'first_to_cut', setup: 0.5, kit: 'body',
      last: { load: 0, reps: [10, 10] }, alts: [] }

// ---------------------------------------------------------------------------
// Coaching rules (mirrors the TypeScript rules engine)
// ---------------------------------------------------------------------------
function suggestLoad(ex) {
  const top = ex.reps[1];
  const hitAll = ex.last.reps.length >= ex.sets && ex.last.reps.every(r => r >= top);
  if (ex.inc > 0 && hitAll) return { load: ex.last.load + ex.inc, up: true,
    why: `You hit ${top} reps on every set at ${ex.last.load}kg last time, so the weight goes up.` };
  const short = ex.last.reps.filter(r => r < top).length;
  return { load: ex.last.load, up: false,
    why: ex.inc === 0 ? 'Bodyweight. Slow and controlled.' : `${short} set${short > 1 ? 's' : ''} fell short of ${top} last time. Hit ${top} on every set, then it goes up.` };
}
const exMinutes = (ex, sets) => ex.setup + (sets * 50 + (sets - 1) * ex.rest) / 60 + 1;
function fitToTime(minutes) {
  let plan = WORKOUT.exercises.map(ex => ({ ex, sets: ex.sets }));
  const total = () => plan.reduce((m, p) => m + exMinutes(p.ex, p.sets), 0) + 8;
  const steps = [
    () => { const c = [...plan].reverse().find(p => p.ex.priority === 'first_to_cut'); if (!c) return false; plan = plan.filter(p => p !== c); return true; },
    () => { const c = plan.find(p => p.ex.priority === 'keep_if_time' && p.sets > 2); if (!c) return false; c.sets = 2; return true; },
    () => { const c = [...plan].reverse().find(p => p.ex.priority === 'keep_if_time'); if (!c) return false; plan = plan.filter(p => p !== c); return true; },
    () => { const c = plan.find(p => p.ex.priority === 'must_keep' && p.sets > 2); if (!c) return false; c.sets = 2; return true; }
  ];
  for (const step of steps) while (total() > minutes && step()) {}
  return { plan, minutes: Math.round(total()) };
}

const plan = () => fitToTime(S.duration);
function setsFor(ex, n) {
  const cur = S.logs[ex.id] || [];
  if (cur.length !== n) {
    const s = suggestLoad(ex);
    S.logs[ex.id] = Array.from({ length: n }, (_, i) => cur[i] || { load: s.load, reps: '', done: false });
  }
  return S.logs[ex.id];
}

  const vol = done.reduce((v, s) => v + (+s.load || 0) * (+s.reps || 0), 0);
  return `<div class="finish fade">
    <svg viewBox="0 0 150 150" width="150" height="150">${ring(150, 14, 1, 'var(--mint)')}<g transform="translate(47 47)" color="var(--mint)">${ic('check', 'ic', 2.4).replace('class="ic"', 'width="56" height="56"')}</g></svg>
    <div><div class="eyebrow">${WORKOUT.name}</div><h1>Workout done</h1></div>
    <div class="stats num">
      <div class="stat">${ic('clock').replace('class="ic"', 'style="color:var(--sky)"')}<b>47:12</b><small>Time</small></div>
      <div class="stat">${ic('weight').replace('class="ic"', 'style="color:var(--amber)"')}<b>${(vol || 8420).toLocaleString('en-GB')}</b><small>kg lifted</small></div>
      <div class="stat">${ic('layers').replace('class="ic"', 'style="color:var(--violet)"')}<b>${done.length || 16}</b><small>Sets</small></div>
      <div class="stat">${ic('trophy').replace('class="ic"', 'style="color:var(--mint)"')}<b>1</b><small>New best · Leg Press</small></div>
    </div>
    <button class="pill-btn white" style="width:100%" data-go="home">Done</button>
  </div>`;
};

const vFuel = () => `<div class="page fade">
  <div class="greet" style="padding-top:6px"><div class="eyebrow">Today</div><h1>Fuel</h1></div>
  <div class="card macro">
    <svg viewBox="0 0 140 140" width="140" height="140" aria-label="Protein 112 of 140 grams">
      ${ring(140, 14, 112 / 140, 'var(--amber)', 'rgba(255,180,94,.15)')}
      <text x="70" y="70" text-anchor="middle" fill="var(--fg)" font-family="Montserrat" font-weight="800" font-size="30">112</text>
      <text x="70" y="92" text-anchor="middle" fill="var(--fg3)" font-family="Poppins" font-size="12">of 140 g protein</text>
    </svg>
    <div class="lines">
      <div class="line"><small>Calories</small><b class="num">1,640 <span>/ 2,100</span></b><div class="bar"><i style="width:78%;background:var(--fg)"></i></div></div>
      <div class="line"><small>Water</small><b class="num">1.5 <span>/ 2.5 L</span></b><div class="bar"><i style="width:60%;background:var(--sky)"></i></div></div>
    </div>
  </div>
  <div class="sec-head"><h2>Meals</h2></div>
  <div class="meals">
    <button class="meal" data-toast="Meal details"><div class="ph"><img src="assets/breakfast.jpg" alt=""><span class="ok">${ic('check', 'ic', 2.6)}</span></div><b>Breakfast</b><small>8:05 · 32g protein</small></button>
    <button class="meal" data-toast="Meal details"><div class="ph"><img src="assets/wrap.jpg" alt=""><span class="ok">${ic('check', 'ic', 2.6)}</span></div><b>Lunch</b><small>12:40 · 41g protein</small></button>
    <button class="meal add" data-toast="Camera opens here"><div class="ph">${ic('camera')}</div><b>Dinner</b><small>Snap or describe</small></button>
  </div>
  <button class="card note" data-go="chat">
    <img class="mark" src="assets/kd-mark.png" alt="">
    <span><small>Kyle · weekly feedback</small><p>Breakfasts are spot on. Add a protein snack mid-afternoon.</p></span>
  </button>
  <div class="sec-head"><h2>New recipes</h2><button data-toast="All recipes">See all</button></div>
  <div class="meals">
    ${[['pasta', 'Creamy Cajun Chicken Pasta', '480 kcal', '45g protein'], ['potato-bowl', 'Big Mac Potato Bowl', '540 kcal', '42g protein'], ['turkey-pasta', 'Turkey Tomato Pasta', '500 kcal', '40g protein']].map(([img, n, k, pr]) =>
      `<button class="recipe" data-toast="${n}"><div class="ph"><img src="assets/${img}.jpg" alt=""></div><b>${n}</b><div class="tags num"><span>${pr}</span><span>${k}</span></div></button>`).join('')}
  </div>
</div>`;

function lineChart(pts, color, w = 320, h = 120) {
  const min = Math.min(...pts), max = Math.max(...pts), pad = 8;
  const xy = pts.map((v, i) => [pad + i * (w - 2 * pad) / (pts.length - 1), h - pad - (v - min) / (max - min || 1) * (h - 2 * pad - 14)]);
  const d = xy.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const last = xy[xy.length - 1];
  const id = 'g' + color.replace(/\W/g, '');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".35"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    ${[0.25, 0.5, 0.75].map(f => `<line x1="0" x2="${w}" y1="${h * f}" y2="${h * f}" stroke="rgba(255,255,255,.05)"/>`).join('')}
    <path d="${d} L${last[0]} ${h} L${xy[0][0]} ${h} Z" fill="url(#${id})"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="6" fill="${color}" stroke="#151716" stroke-width="3"/>
  </svg>`;
}

const vProgress = () => {
  const tabs = ['Strength', 'Body', 'Habits'];
  const heat = [[2,0,2,0,1,'pt',0],[2,0,2,0,2,'pt',0],[1,0,2,0,0,'pt',0],[2,0,2,0,2,'pt',0],[2,0,0,2,0,'pt',0],[2,0,2,0,2,'pt',1],[2,'pt',2,0,0,0,0],[2,'pt',0,0,0,0,0]];
  let body = '';
  if (S.progTab === 0) body = `
    <div class="card big-stat"><div class="eyebrow">Leg Press · 8 weeks</div><div class="delta num">+30 kg</div><div class="lbl num">100 → 130 kg for 10+ reps</div>
      ${lineChart([100, 100, 110, 110, 110, 120, 120, 130], '#7ed597')}</div>
    <div class="pair">
      <div class="card mini">${ic('trophy').replace('class="ic"', 'class="i" style="color:var(--amber)"')}<b class="num">4</b><small>New bests this block</small></div>
      <div class="card mini">${ic('weight').replace('class="ic"', 'class="i" style="color:var(--sky)"')}<b class="num">+18%</b><small>Weekly volume</small></div>
    </div>`;
  else if (S.progTab === 1) body = `
    <div class="card big-stat"><div class="eyebrow">Bodyweight · 7-day average</div><div class="delta num" style="color:var(--violet)">−3.4 kg</div><div class="lbl num">71.2 → 67.8 kg since 1 September</div>
      ${lineChart([71.2, 71.0, 70.6, 70.3, 70.1, 69.6, 69.2, 69.0, 68.6, 68.3, 68.1, 67.8], '#a99bff')}</div>
    <div class="pair">
      <div class="card mini">${ic('body').replace('class="ic"', 'class="i" style="color:var(--violet)"')}<b class="num">−5 cm</b><small>Waist</small></div>
      <button class="card mini" style="text-align:left" data-toast="Photo comparison, private to you and Kyle">${ic('camera').replace('class="ic"', 'class="i" style="color:var(--fg2)"')}<b>Photos</b><small>Compare week 1 and now</small></button>
    </div>`;
  else body = `
    <div class="card"><div class="heat">${heat.map(w => `<div class="col">${w.map(v => `<i class="${v === 'pt' ? 'pt' : v === 2 ? 'l2' : v === 1 ? 'l1' : ''}"></i>`).join('')}</div>`).join('')}</div>
      <div style="display:flex;gap:16px;padding:0 20px 18px;font-size:12px;color:var(--fg3)"><span style="display:flex;gap:6px;align-items:center"><i style="width:10px;height:10px;border-radius:3px;background:var(--mint)"></i>Workout</span><span style="display:flex;gap:6px;align-items:center"><i style="width:10px;height:10px;border-radius:3px;background:var(--sky)"></i>PT session</span></div></div>
    <div class="pair">
      <div class="card mini">${ic('flame').replace('class="ic"', 'class="i" style="color:var(--amber)"')}<b class="num">6 wks</b><small>Streak</small></div>
      <div class="card mini">${ic('check').replace('class="ic"', 'class="i" style="color:var(--mint)"')}<b class="num">92%</b><small>Sessions completed</small></div>
    </div>`;
  return `<div class="page fade">
    <div class="greet" style="padding-top:6px"><div class="eyebrow">Since 1 September</div><h1>Progress</h1></div>
    <div class="seg" role="tablist">${tabs.map((t, i) => `<button role="tab" class="${S.progTab === i ? 'on' : ''}" data-ptab="${i}">${t}</button>`).join('')}</div>
    ${body}
  </div>`;
};

const vChat = () => `<div class="page fade" style="padding-bottom:200px">
  <div class="chat-head"><img src="assets/kd-mark.png" alt=""><span><b>Kyle</b><small>Usually replies within a few hours</small></span></div>
  <div class="msgs">
    <div class="stamp">Yesterday</div>
    <div class="msg them">Great session Monday. Leg press goes up today 💪</div>
    <div class="msg me">Thanks! Knee felt a bit tight on the lunges though</div>
    <div class="msg them">Noted. Keep the lunges short-stride and tell me if it's worse.</div>
    ${S.chat.map(m => m).join('')}
  </div>
</div>`;

function chatDock() {
  return `<div class="dock" style="display:grid;grid-template-columns:minmax(0,1fr);gap:12px;padding-bottom:calc(96px + env(safe-area-inset-bottom, 0px))">
    <div class="suggests">
      <button data-ask="swap">${ic('spark')} Can I swap leg press?</button>
      <button data-ask="protein">${ic('spark')} Protein ideas</button>
      <button data-ask="knee">${ic('spark')} My knee hurts</button>
    </div>
    <div class="composer"><label><input id="msg" placeholder="Message Kyle" aria-label="Message"></label><button class="round" data-toast="Sent" aria-label="Send">${ic('send')}</button></div>
  </div>`;
}

// ---------------------------------------------------------------------------
// Sheets
// ---------------------------------------------------------------------------
function sheetHTML() {
  const { plan: pl } = plan(); const ex = pl[S.idx]?.ex;
  if (S.sheet === 'time') {
    const full = fitToTime(999).plan, fit = fitToTime(S.duration).plan;
    return `<h3>How long have you got?</h3>
      <div class="durs">${[30, 45, 60, 90].map(m => `<button class="dur" aria-pressed="${S.duration === m}" data-dur="${m}"><b class="num">${m}</b><small>min</small></button>`).join('')}</div>
      <div class="cutlist">${full.map(f => { const k = fit.find(x => x.ex.id === f.ex.id);
        return `<div class="${!k ? 'cut' : k.sets < f.sets ? 'trim' : ''}">${f.ex.name}<span class="num">${k ? `${k.sets} sets` : 'skipped'}</span></div>`; }).join('')}</div>
      <button class="pill-btn white" data-close>Done</button>`;
  }
  if (S.sheet === 'swap') {
    return ex.alts.length ? `<div><h3>Swap ${ex.name}</h3><div class="sub">Kyle's approved options · today only</div></div>
      <div class="opts">${ex.alts.map(([n, w, k]) => `<button class="opt" data-alt="${n}"><span class="tile">${ic(k)}</span><span><b>${n}</b><span>${w}</span></span></button>`).join('')}</div>`
      : `<div><h3>No swaps yet</h3><div class="sub">Skip this one or ask Kyle.</div></div><button class="pill-btn dark" data-go="chat">Ask Kyle</button>`;
  }
  if (S.sheet === 'pain') {
    const p = S.pain;
    if (p.sent) return `<div class="sent"><span class="ok">${ic('check', 'ic', 2.6)}</span><h3>Kyle's been told</h3>
      <p>If the pain is sharp or sudden, stop and get it checked. The app can't diagnose injuries.</p></div>
      <button class="pill-btn white" data-close>${p.act === 'swap' ? 'Choose a swap' : 'Done'}</button>`;
    const ready = p.area && p.act;
    return `<h3>Where does it hurt?</h3>
      <div class="areas">${['Knee', 'Lower back', 'Hip', 'Shoulder', 'Ankle', 'Other'].map(a => `<button class="area" aria-pressed="${p.area === a}" data-area="${a}">${a}</button>`).join('')}</div>
      <div class="sev"><div class="big"><b class="num" id="sevnum">${p.sev}</b><span>out of 10</span></div>
        <input type="range" id="sev" min="0" max="10" value="${p.sev}" aria-label="Pain level"></div>
      <div class="tri">
        <button aria-pressed="${p.act === 'swap'}" data-act="swap">${ic('swap')}Swap it</button>
        <button aria-pressed="${p.act === 'skip'}" data-act="skip">${ic('skip')}Skip it</button>
        <button aria-pressed="${p.act === 'stop'}" data-act="stop">${ic('stop')}Stop today</button>
      </div>
      <button class="pill-btn ${ready ? 'mint' : 'dark'}" data-sendpain ${ready ? '' : 'disabled style="opacity:.5"'}>Send to Kyle</button>`;
  }
  return '';
}

function restHTML() {
  const { plan: pl } = plan(); const cur = pl[S.idx]; const ex = cur.ex;
  const next = S.logs[ex.id].findIndex(s => !s.done);
  const pct = S.rest.left / S.rest.total;
  return `<div class="rest" role="timer">
    <div class="eyebrow">Rest</div>
    <div class="ringwrap"><svg viewBox="0 0 240 240" width="240" height="240" id="restring">${ring(240, 12, pct, 'var(--mint)', 'rgba(255,255,255,.08)')}</svg>
      <div class="c"><b id="restnum">${fmt(S.rest.left)}</b></div></div>
    <div class="nextup">Next · <b>Set ${next + 1}</b> · <b class="num">${ex.inc ? S.logs[ex.id][next].load + ' kg' : 'BW'}</b></div>
    <div class="btns"><button class="pill-btn dark" data-rest="+30">+30s</button><button class="pill-btn white" data-rest="skip">Skip</button></div>
  </div>`;
}

// ---------------------------------------------------------------------------
// Render
// ---------------------------------------------------------------------------
const $ = id => document.getElementById(id);
const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
const TABS = [['home', 'Home'], ['train', 'Train'], ['fuel', 'Fuel'], ['progress', 'Progress'], ['chat', 'Kyle']];

function render(keepScroll) {
  const sc = $('screen'), top = sc.scrollTop;
  const v = S.view;
  $('view').innerHTML = v === 'home' ? vHome() : v === 'train' ? vTrain() : v === 'workout' ? vWorkout() : v === 'finish' ? vFinish()
    : v === 'fuel' ? vFuel() : v === 'progress' ? vProgress() : vChat();
  const tb = $('tabbar');
  tb.hidden = v === 'workout' || v === 'finish';
  const active = v === 'workout' ? 'train' : v;
  tb.innerHTML = TABS.map(([k, l]) => `<button class="${k === active ? 'on' : ''}" data-go="${k}" aria-label="${l}">${ic(k)}<span>${l}</span>${k === 'chat' ? '<i class="pip"></i>' : ''}</button>`).join('');

  let layer = '';
  if (v === 'workout') {
    const last = S.idx === plan().plan.length - 1;
    layer += `<div class="dock">
      <button class="round" data-sheet="swap" aria-label="Swap exercise">${ic('swap')}</button>
      <button class="round pain" data-sheet="pain" aria-label="Report pain">${ic('pain')}</button>
      <button class="pill-btn mint" data-next>${last ? 'Finish' : 'Next'} ${ic('right')}</button></div>`;
  }
  if (v === 'chat') layer += chatDock();
  if (S.rest) layer += restHTML();
  if (S.sheet) layer += `<div class="scrim" data-scrim><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${sheetHTML()}</div></div>`;
  $('layer').innerHTML = layer;
  sc.scrollTop = keepScroll ? top : 0;
}

function go(v) {
  S.view = v; S.sheet = null; stopRest();
  try { history.replaceState(null, '', '#' + v); } catch (e) {}
  render(false);
}
function toast(m) { const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2200); }

function startRest(sec) {
  stopRest();
  S.rest = { left: sec, total: sec };
  S.rest.timer = setInterval(() => {
    S.rest.left--;
    if (S.rest.left <= 0) { stopRest(); render(true); toast('Rest done · next set'); return; }
    const n = $('restnum'), r = $('restring');
    if (n) n.textContent = fmt(S.rest.left);
    if (r) r.innerHTML = ring(240, 12, S.rest.left / S.rest.total, 'var(--mint)', 'rgba(255,255,255,.08)');
  }, 1000);
}
function stopRest() { if (S.rest) clearInterval(S.rest.timer); S.rest = null; }

const ANSWERS = {
  swap: ['Can I swap leg press?', 'Yes. Kyle has approved Hack Squat or Goblet Squat for today. Tap ⇄ during the exercise to swap.'],
  protein: ['Protein ideas', 'Greek yoghurt with berries (20g) or a chicken wrap from your recipes (41g) would close today\'s gap.'],
  knee: ['My knee hurts', 'I\'ve passed this to Kyle. Use "I have pain" in your workout so he sees exactly where and how bad.']
};

document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-scrim]');
  if (!t) return;
  const d = t.dataset;
  if (d.scrim !== undefined && e.target !== t) return;

  if (d.go) return go(d.go);
  if (d.toast) return toast(d.toast);
  if (d.ptab) { S.progTab = +d.ptab; return render(true); }
  if (d.why !== undefined) { S.why = !S.why; return render(true); }
  if (d.dur) { S.duration = +d.dur; S.idx = 0; return render(true); }
  if (d.tick !== undefined) {
    const ex = plan().plan[S.idx].ex, s = S.logs[ex.id][+d.tick];
    if (!s.reps) s.reps = ex.reps[1];
    s.done = !s.done;
    if (s.done && S.logs[ex.id].some(x => !x.done)) startRest(ex.rest); else stopRest();
    return render(true);
  }
  if (d.rest === '+30') { S.rest.left += 30; S.rest.total += 30; $('restnum').textContent = fmt(S.rest.left); return; }
  if (d.rest === 'skip') { stopRest(); return render(true); }
  if (d.next !== undefined) {
    if (S.idx < plan().plan.length - 1) { S.idx++; S.why = false; return render(false); }
    S.view = 'finish'; return render(false);
  }
  if (d.sheet) { S.sheet = d.sheet; if (d.sheet === 'pain') S.pain = { area: null, sev: 3, act: null, sent: false }; return render(true); }
  if (d.scrim !== undefined || d.close !== undefined) {
    S.sheet = S.sheet === 'pain' && S.pain.sent && S.pain.act === 'swap' ? 'swap' : null; return render(true);
  }
  if (d.alt) { S.swaps[plan().plan[S.idx].ex.id] = d.alt; S.sheet = null; toast(`Swapped to ${d.alt}`); return render(true); }
  if (d.area) { S.pain.area = d.area; return render(true); }
  if (d.act) { S.pain.act = d.act; return render(true); }
  if (d.sendpain !== undefined) { S.pain.sent = true; return render(true); }
  if (d.ask) {
    const [q, a] = ANSWERS[d.ask];
    S.chat.push(`<div class="msg me">${q}</div>`, `<div class="msg ai"><div class="who">${ic('spark')} Assistant</div>${a}</div>`);
    render(true); const sc = $('screen'); sc.scrollTop = sc.scrollHeight; return;
  }
});
document.addEventListener('input', e => {
  const i = e.target;
  if (i.id === 'sev') { S.pain.sev = +i.value; $('sevnum').textContent = i.value; return; }
  if (!i.dataset.set) return;
  const ex = plan().plan[S.idx].ex; S.logs[ex.id][+i.dataset.set][i.dataset.k] = i.value;
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.sheet) { S.sheet = null; render(true); } });

const h = (location.hash || '').slice(1);
if (['home', 'train', 'workout', 'fuel', 'progress', 'chat'].includes(h)) S.view = h;
render(false);
</script>
