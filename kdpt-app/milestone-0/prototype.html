function sheetHTML() {
  if (S.sheet === 'notifset') return `<div><h3>Notifications</h3><div class="sub">Choose what reaches your phone</div></div>${toggleList()}<button class="pill-btn white" data-close>Done</button>`;
  if (S.sheet === 'addfood') return addFoodHTML();
  if (S.sheet === 'avail') return availHTML();
  if (S.sheet === 'book') {
    const bk = S.book, reqs = Object.keys(bk.req).length;
    if (bk.pick !== null) {
      const [d, day, t] = NOV[bk.pick];
      const alts = d === 'MON' ? [['MON', day, '17:30'], ['TUE', day + 1, '18:00'], ['WED', day + 2, '9:00']] : [['THU', day, '18:00'], ['FRI', day + 1, '7:00'], ['WED', day - 1, '9:00']];
      return `<div><h3>Ask to move ${d.charAt(0) + d.slice(1).toLowerCase()} ${day} Nov</h3><div class="sub">These are times Kyle has free that week. He'll approve or suggest another.</div></div>
        <div class="group">${alts.map(([dd, nn, tt]) => `<button class="optrow" data-alttime="${dd.charAt(0) + dd.slice(1).toLowerCase()} ${nn} Nov · ${tt}"><span class="datebox sm"><small>${dd}</small><b class="num">${nn}</b></span><span class="t"><b class="num">${tt}</b><small>Studio</small></span><span class="chev">${ic('right')}</span></button>`).join('')}</div>
        <button class="pill-btn dark" data-keeptime>Keep ${t} on the ${day}th</button>`;
    }
    if (bk.done) return `<div class="sent"><span class="ok" style="background:var(--sky);color:#03121f">${ic('check')}</span><h3>Sent to Kyle</h3><p>Your sessions show as pending until Kyle confirms them${reqs ? `, including your ${reqs} change request${reqs > 1 ? 's' : ''}` : ''}. You'll get a notification as soon as he does.</p></div><button class="pill-btn white" data-close>Done</button>`;
    return `<div><h3>Your November sessions</h3><div class="sub">Kyle has proposed these. Check them, ask to move any that don't work, then send them back. Nothing is booked until Kyle confirms.</div></div>
      <button class="optrow" style="background:var(--s2);border-radius:14px" data-sheet="avail"><span class="li" style="color:var(--sky)">${ic('clock')}</span><span class="t"><b>My times change each month</b><small>Send Kyle your availability instead</small></span><span class="chev">${ic('right')}</span></button>
      <div class="group">${NOV.map(([d, day, t], i) => `<div class="optrow"><span class="datebox sm"><small>${d}</small><b class="num">${day}</b></span><span class="t"><b class="num">${t} · Studio</b><small>${bk.req[i] ? `<span style="color:var(--amber)">Asked for ${bk.req[i]}</span>` : 'PT with Kyle · 60 min'}</small></span><button class="add" style="color:var(--sky)" data-move="${i}">${bk.req[i] ? 'Change' : 'Move'}</button></div>`).join('')}</div>
      <p class="foot">Free to change up to 24 hours before. Later cancellations count as used.</p>
      <button class="pill-btn mint" data-bookok>Send to Kyle${reqs ? ` · ${reqs} change${reqs > 1 ? 's' : ''}` : ''}</button>`;
  }
  if (S.sheet === 'pay') {
    if (S.paid) return `<div class="sent"><span class="ok" style="background:var(--amber);color:#2a1600">${ic('check', 'ic', 2.6)}</span><h3>Paid · thank you</h3><p>Receipt sent to your email. ${S.autopay ? 'December will be taken automatically.' : ''}</p></div><button class="pill-btn white" data-close>Done</button>`;
    return `<div><h3>November payment</h3><div class="sub">Due Sunday 1 November</div></div>
      <div class="paycard"><div class="line"><span>8 PT sessions</span><span class="num">£260.00</span></div><div class="line"><span>1–30 November</span><span></span></div><div class="line total"><span>Total</span><span class="num">£260.00</span></div></div>
      <div class="cardrow"><span class="brand">VISA</span><span class="t"><b>•••• 4242</b><small>Expires 08/28</small></span><button data-toast="Change card in Stripe" style="color:var(--fg2);font-size:14px">Change</button></div>
      <div class="tg"><span class="li" style="background:rgba(255,180,94,.14);color:var(--amber)">${ic('card')}</span><span class="t"><b>Pay automatically each month</b><small>Reminder 3 days before, cancel any time</small></span><button class="sw" role="switch" aria-checked="${S.autopay}" data-autopay aria-label="Pay automatically"></button></div>
      <button class="pill-btn mint" data-payok>Pay £260.00</button>`;
  }
  if (S.sheet === 'momentum') {
    const week = [['M', 70, 'on'], ['T', 78, 'on'], ['W', 84, 'now'], ['T', 0, ''], ['F', 0, ''], ['S', 0, ''], ['S', 0, '']];
    return `<div class="mom-big">
        <div class="wrap">${rings(184, 14)}<div class="c">${ic('bolt').replace('class="ic"', 'width="30" height="30" style="color:var(--fg)"')}</div></div>
        <div><b class="word" style="font:800 30px var(--display);color:var(--mint);letter-spacing:-.02em">Strong</b><div class="eyebrow" style="margin-top:2px">Week 6 of 8</div></div>
        <p>Your best week of the block so far. One more workout and a protein snack closes the rings.</p>
      </div>
      <div class="contrib group">${MOM.map(m => `<div class="crow">
        <span class="li" style="--k:${m.col}">${ic(m.icon)}</span>
        <span><b>${m.k}</b><small>${m.val}</small><div class="bar"><i style="width:${Math.round(m.pct * 100)}%;background:${m.col}"></i></div></span>
        <span class="st" style="background:${m.st[1]};color:${m.st[2]}">${m.st[0]}</span></div>`).join('')}</div>
      <div><div class="eyebrow" style="margin-bottom:10px">This week</div>
        <div class="trend">${week.map(([d, v, c]) => `<div class="${c}"><i style="height:${Math.round((v || 8) * 0.85)}px"></i>${d}</div>`).join('')}</div></div>
      <div class="preview"><span class="acc">${accBars(freqInfo().n)}</span><span><b>Accuracy: ${freqInfo().acc}</b><small>From your workouts, meals and ${freqInfo().label.toLowerCase()} check-ins. Your coach sees the same view.</small></span></div>
      <button class="pill-btn white" data-go="progress">See all progress</button>`;
  }
  const { plan: pl } = plan(); const ex = pl[S.idx]?.ex;
  if (S.sheet === 'time') {
    const full = fitToTime(999).plan, fit = fitToTime(S.duration).plan;
    return `<h3>How long have you got?</h3>
      <div class="durs">${[30, 45, 60, 90].map(m => `<button class="dur" aria-pressed="${S.duration === m}" data-dur="${m}"><b class="num">${m}</b><small>min</small></button>`).join('')}</div>
      <div class="cutlist">${full.map(f => { const k = fit.find(x => x.ex.id === f.ex.id);
        return `<div class="${!k ? 'cut' : k.sets < f.sets ? 'trim' : ''}">${f.ex.name}<span class="num">${k ? `${k.sets} sets` : 'skipped'}</span></div>`; }).join('')}</div>
      <button class="pill-btn white" data-close>Done</button>`;
  }
  if (S.sheet === 'swap') {
    return ex.alts.length ? `<div><h3>Swap ${ex.name}</h3><div class="sub">Your coach's approved options · today only</div></div>
      <div class="opts">${ex.alts.map(([n, w, k]) => `<button class="opt" data-alt="${n}"><span class="tile">${ic(k)}</span><span><b>${n}</b><span>${w}</span></span></button>`).join('')}</div>`
      : `<div><h3>No swaps yet</h3><div class="sub">Skip this one or ask your coach.</div></div><button class="pill-btn dark" data-go="coachai">Ask KAI</button>`;
  }
  if (S.sheet === 'pain') {
    const p = S.pain;
    if (p.sent) return `<div class="sent"><span class="ok">${ic('check', 'ic', 2.6)}</span><h3>Your coach has been told</h3>
      <p>If the pain is sharp or sudden, stop and get it checked. The app can't diagnose injuries.</p></div>
      <button class="pill-btn white" data-close>${p.act === 'swap' ? 'Choose a swap' : 'Done'}</button>`;
    const ready = p.area && p.act;
    return `<h3>Where does it hurt?</h3>
      <div class="areas">${['Knee', 'Lower back', 'Hip', 'Shoulder', 'Ankle', 'Other'].map(a => `<button class="area" aria-pressed="${p.area === a}" data-area="${a}">${a}</button>`).join('')}</div>
      <div class="sev"><div class="big"><b class="num" id="sevnum">${p.sev}</b><span>out of 10</span></div>
        <input type="range" id="sev" min="0" max="10" value="${p.sev}" aria-label="Pain level"></div>
      <div class="tri">
        <button aria-pressed="${p.act === 'swap'}" data-act="swap">${ic('swap')}Swap it</button>
        <button aria-pressed="${p.act === 'skip'}" data-act="skip">${ic('skip')}Skip it</button>
        <button aria-pressed="${p.act === 'stop'}" data-act="stop">${ic('stop')}Stop today</button>
      </div>
      <button class="pill-btn ${ready ? 'mint' : 'dark'}" data-sendpain ${ready ? '' : 'disabled style="opacity:.5"'}>Send to your coach</button>`;
  }
  return '';
}

function restHTML() {
  const { plan: pl } = plan(); const cur = pl[S.idx]; const ex = cur.ex;
  const next = S.logs[ex.id].findIndex(s => !s.done);
  const pct = S.rest.left / S.rest.total;
  return `<div class="rest" role="timer">
    <div class="eyebrow">Rest</div>
    <div class="ringwrap"><svg viewBox="0 0 240 240" width="240" height="240" id="restring">${ring(240, 12, pct, 'var(--mint)', 'rgba(255,255,255,.08)')}</svg>
      <div class="c"><b id="restnum">${fmt(S.rest.left)}</b></div></div>
    <div class="nextup">Next · <b>Set ${next + 1}</b> · <b class="num">${ex.inc ? S.logs[ex.id][next].load + ' kg' : 'BW'}</b></div>
    <div class="btns"><button class="pill-btn dark" data-rest="+30">+30s</button><button class="pill-btn white" data-rest="skip">Skip</button></div>
  </div>`;
}

// ---------------------------------------------------------------------------
// Render
// ---------------------------------------------------------------------------
const $ = id => document.getElementById(id);
const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
const TABS = [['home', 'Home'], ['train', 'Train'], ['fuel', 'Fuel'], ['progress', 'Progress'], ['community', 'Community']];

function render(keepScroll) {
  const sc = $('screen'), top = sc.scrollTop;
  const v = S.view;
  $('view').innerHTML = v === 'home' ? vHome() : v === 'train' ? vTrain() : v === 'workout' ? vWorkout() : v === 'finish' ? vFinish()
    : v === 'fuel' ? vFuel() : v === 'progress' ? vProgress() : v === 'onboard' ? vOnboard() : v === 'notifs' ? vNotifs() : v === 'community' ? vCommunity() : v === 'coachai' ? vAI() : v === 'checkin' ? vCheckin() : vChat();
  const tb = $('tabbar');
  tb.hidden = ['workout', 'finish', 'onboard', 'chat', 'coachai', 'checkin'].includes(v);
  const active = v === 'workout' ? 'train' : v === 'chat' || v === 'notifs' ? 'home' : v;
  tb.innerHTML = TABS.map(([k, l]) => `<button class="${k === active ? 'on' : ''}" data-go="${k}" aria-label="${l}">${ic(k)}<span>${l}</span>${k === 'community' ? '<i class="pip" style="background:var(--violet)"></i>' : ''}</button>`).join('');

  let layer = '';
  if (v === 'workout') {
    const last = S.idx === plan().plan.length - 1;
    layer += `<div class="dock">
      <button class="round" data-sheet="swap" aria-label="Swap exercise">${ic('swap')}</button>
      <button class="round pain" data-sheet="pain" aria-label="Report pain">${ic('pain')}</button>
      <button class="pill-btn mint" data-next>${last ? 'Finish' : 'Next'} ${ic('right')}</button></div>`;
  }
  if (v === 'chat') layer += chatDock();
  if (v === 'coachai') layer += aiDock();
  if (v === 'checkin' && S.ci.step <= 4) layer += `<div class="dock"><button class="pill-btn ${S.ci.step === 4 ? 'mint' : 'white'}" data-ci="next">${S.ci.step === 4 ? 'Send to your coach' : 'Continue'}</button></div>`;
  if (v === 'onboard' && S.onb.step >= 1 && S.onb.step <= 4) layer += `<div class="dock"><button class="pill-btn white" data-onb="next">${S.onb.step === 4 ? 'Allow notifications' : 'Continue'}</button></div>`;
  if (S.rest) layer += restHTML();
  if (S.sheet) layer += `<div class="scrim" data-scrim><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${sheetHTML()}</div></div>`;
  $('layer').innerHTML = layer;
  sc.scrollTop = keepScroll ? top : 0;
}

function go(v) {
  if (S.view === 'notifs') S.read = true;
  S.view = v; S.sheet = null; stopRest();
  try { history.replaceState(null, '', '#' + v); } catch (e) {}
  render(false);
}
function showPush(title, body, sheet) {
  const el = $('push');
  el.innerHTML = `<img src="assets/kd-mark.png" alt=""><span class="t"><span class="row"><span>KDPT</span><span>now</span></span><b>${title}</b><p>${body}</p></span>`;
  el.dataset.sheet = sheet; el.hidden = false;
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('show')));
  clearTimeout(showPush.t); showPush.t = setTimeout(hidePush, 6500);
}
function hidePush() { const el = $('push'); el.classList.remove('show'); }
function saveCheckinText() {
  if (!S.ci) return;
  for (const [id, k] of [['ciwords', 'words'], ['cinote', 'note'], ['ciwaist', 'waist'], ['ciweight', 'weight']]) { const el = $(id); if (el) S.ci[k] = el.value; }
}
function toast(m) { const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2200); }

function startRest(sec) {
  stopRest();
  S.rest = { left: sec, total: sec };
  S.rest.timer = setInterval(() => {
    S.rest.left--;
    if (S.rest.left <= 0) { stopRest(); render(true); toast('Rest done · next set'); return; }
    const n = $('restnum'), r = $('restring');
    if (n) n.textContent = fmt(S.rest.left);
    if (r) r.innerHTML = ring(240, 12, S.rest.left / S.rest.total, 'var(--mint)', 'rgba(255,255,255,.08)');
  }, 1000);
}
function stopRest() { if (S.rest) clearInterval(S.rest.timer); S.rest = null; }


document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-scrim]');
  if (!t) return;
  const d = t.dataset;
  if (d.scrim !== undefined && e.target !== t) return;

  if (t.id === 'push') { hidePush(); if (S.view !== 'home') S.view = 'home'; S.sheet = t.dataset.sheet; return render(true); }
  if (d.go) return go(d.go);
  if (d.toast) return toast(d.toast);
  if (d.onb) {
    const o = S.onb;
    if (d.onb === 'finish') { go('home'); setTimeout(() => showPush('Your November sessions are ready', 'Kyle has proposed 8 sessions on your usual days. Tap to review.', 'book'), 1400); return; }
    o.step = Math.max(0, Math.min(5, o.step + (d.onb === 'back' ? -1 : 1))); return render(false);
  }
  if (d.goal) { S.onb.goal = d.goal; return render(true); }
  if (d.days) { S.onb.days = +d.days; return render(true); }
  if (d.freq) { S.onb.freq = d.freq; return render(true); }
  if (d.cday) { S.onb.day = d.cday; return render(true); }
  if (d.notif) { S.notifs[d.notif] = !S.notifs[d.notif]; return render(true); }
  if (d.bookok !== undefined) { S.book.done = true; return render(true); }
  if (d.move) { S.book.pick = +d.move; return render(true); }
  if (d.avday) { const k = d.avday, a = S.avail.days; a[k] = a[k] ? null : HOURS[k].slice(); return render(true); }
  if (d.availsend !== undefined) { S.avail.note = ($('avnote') || {}).value || ''; S.avail.sent = true; return render(true); }
  if (d.alttime) { S.book.req[S.book.pick] = d.alttime; S.book.pick = null; return render(true); }
  if (d.keeptime !== undefined) { delete S.book.req[S.book.pick]; S.book.pick = null; return render(true); }
  if (d.fday) { S.fuelDay = +d.fday; return render(true); }
  if (d.addfood) { S.add = { slot: d.addfood, tab: 'search', q: '' }; S.sheet = 'addfood'; return render(true); }
  if (d.ftab) { S.add.tab = d.ftab; return render(true); }
  if (d.pickfood) { S.log[S.add.slot].push(d.pickfood); toast(`Added to ${S.add.slot}`); S.sheet = null; return render(true); }
  if (d.quickadd !== undefined) {
    const v = id => parseFloat(($(id) || {}).value) || 0;
    const f = { id: 'q' + Date.now(), n: 'Quick add', p: 'Entered by you', kcal: v('qk'), P: v('qp'), C: v('qc'), F: v('qf') };
    FOODS.push(f); S.log[S.add.slot].push(f.id); S.sheet = null; toast(`Added to ${S.add.slot}`); return render(true);
  }
  if (d.water !== undefined) { S.water = Math.min(10, S.water + 1); return render(true); }
  if (d.lift) { S.lift = d.lift; return render(true); }
  if (d.guide) { S.guide[d.guide] = !S.guide[d.guide]; return render(true); }
  if (d.showweight !== undefined) { S.showWeight = !S.showWeight; return render(true); }
  if (d.ctab) { S.comm.tab = d.ctab; S.comm.cat = null; return render(true); }
  if (d.cat !== undefined) { S.comm.cat = d.cat || null; return render(true); }
  if (d.plike) { S.comm.liked[d.plike] = !S.comm.liked[d.plike]; return render(true); }
  if (d.popen) { S.comm.open[d.popen] = !S.comm.open[d.popen]; return render(true); }
  if (d.preply) {
    const el = $('rp-' + d.preply), v = el && el.value.trim(); if (!v) return;
    S.comm.posts.find(x => x.id === d.preply).cmts.push(['sarah', v.replace(/</g, '&lt;')]); return render(true);
  }
  if (d.newpost !== undefined) {
    const el = $('newpost'), v = el && el.value.trim(); if (!v) return;
    S.comm.posts.splice(1, 0, { id: 'n' + Date.now(), by: 'sarah', when: 'Now', body: v.replace(/</g, '&lt;'), likes: 0, cmts: [] }); return render(true);
  }
  if (d.libfood) { S.log.Dinner.push(d.libfood); toast('Added to today\'s dinner in Fuel'); return; }
  if (d.autopay !== undefined) { S.autopay = !S.autopay; return render(true); }
  if (d.payok !== undefined) { S.paid = true; return render(true); }
  if (d.checkin !== undefined) { S.ci = newCheckin(); return go('checkin'); }
  if (d.ci) {
    saveCheckinText();
    if (d.ci === 'close') return go('home');
    S.ci.step = Math.max(1, Math.min(5, S.ci.step + (d.ci === 'back' ? -1 : 1))); return render(false);
  }
  if (d.cim) { S.ci[d.cim] = +d.v; return render(true); }
  if (d.ache) { S.ci.aches = d.ache; return render(true); }
  if (d.win) { S.ci.wins[d.win] = !S.ci.wins[d.win]; return render(true); }
  if (d.photo !== undefined) { S.ci.photo = !S.ci.photo; if (S.ci.photo) toast('Photo added · private'); return render(true); }
  if (d.measure !== undefined) { saveCheckinText(); S.ci.measure = !S.ci.measure; return render(true); }
  if (d.sup) { saveCheckinText(); S.ci.support[d.sup] = !S.ci.support[d.sup]; return render(true); }
  if (d.ptab) { S.progTab = +d.ptab; return render(true); }
  if (d.why !== undefined) { S.why = !S.why; return render(true); }
  if (d.dur) { S.duration = +d.dur; S.idx = 0; return render(true); }
  if (d.tick !== undefined) {
    const ex = plan().plan[S.idx].ex, s = S.logs[ex.id][+d.tick];
    if (!s.reps) s.reps = ex.reps[1];
    s.done = !s.done;
    if (s.done && S.logs[ex.id].some(x => !x.done)) startRest(ex.rest); else stopRest();
    return render(true);
  }
  if (d.rest === '+30') { S.rest.left += 30; S.rest.total += 30; $('restnum').textContent = fmt(S.rest.left); return; }
  if (d.rest === 'skip') { stopRest(); return render(true); }
  if (d.next !== undefined) {
    if (S.idx < plan().plan.length - 1) { S.idx++; S.why = false; return render(false); }
    S.view = 'finish'; return render(false);
  }
  if (d.sheet) { if (S.view === 'notifs') S.read = true; S.sheet = d.sheet; if (d.sheet === 'pain') S.pain = { area: null, sev: 3, act: null, sent: false }; return render(true); }
  if (d.scrim !== undefined || d.close !== undefined) {
    S.sheet = S.sheet === 'pain' && S.pain.sent && S.pain.act === 'swap' ? 'swap' : null; return render(true);
  }
  if (d.alt) { S.swaps[plan().plan[S.idx].ex.id] = d.alt; S.sheet = null; toast(`Swapped to ${d.alt}`); return render(true); }
  if (d.area) { S.pain.area = d.area; return render(true); }
  if (d.act) { S.pain.act = d.act; return render(true); }
  if (d.sendpain !== undefined) { S.pain.sent = true; return render(true); }
  if (d.ai) {
    if (!S.ai.includes(d.ai)) S.ai.push(d.ai);
    if (AI[d.ai].handoff) S.handed = true;
    render(true); const sc = $('screen'); sc.scrollTop = sc.scrollHeight; return;
  }
  if (d.sendkyle !== undefined) {
    const v = $('msg').value.trim(); if (!v) return;
    S.chat.push(v.replace(/</g, '&lt;')); render(true); const sc = $('screen'); sc.scrollTop = sc.scrollHeight; return;
  }
});
document.addEventListener('input', e => {
  const i = e.target;
  if (i.dataset.avk) { S.avail.days[i.dataset.avk][+i.dataset.ix] = +i.value; return; }
  if (i.id === 'fq') { S.add.q = i.value; const q = i.value.toLowerCase(); $('fres').innerHTML = foodResults(FOODS.filter(f => f.n.toLowerCase().includes(q))); return; }
  if (i.id === 'moodr') { const m = MOODS[+i.value]; S.ci.mood = +i.value; $('mind').style.setProperty('--c', m[1]); $('mindword').textContent = m[0]; return; }
  if (i.id === 'sev') { S.pain.sev = +i.value; $('sevnum').textContent = i.value; return; }
  if (!i.dataset.set) return;
  const ex = plan().plan[S.idx].ex; S.logs[ex.id][+i.dataset.set][i.dataset.k] = i.value;
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.sheet) { S.sheet = null; render(true); } });

const h = (location.hash || '').slice(1);
if (['home', 'train', 'workout', 'fuel', 'progress', 'chat', 'community', 'notifs', 'coachai'].includes(h)) S.view = h;
else if (h === 'checkin') { S.ci = newCheckin(); S.view = 'checkin'; }
else if (h !== 'checkin') S.view = 'onboard';
render(false);
if (S.view === 'home') setTimeout(() => showPush('Your November sessions are ready', 'Kyle has proposed 8 sessions on your usual days. Tap to review.', 'book'), 2500);
</script>
