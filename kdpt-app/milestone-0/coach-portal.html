<title>KDPT Coach Portal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Poppins:wght@400;500;600&display=swap">
<style>
/* Layout: desktop portal with a fixed icon sidebar and one working area.
   Below 900px the sidebar becomes a scrolling bar along the top.
   Same dark palette as the client app: mint = training and actions,
   amber = nutrition, violet = check-ins and AI, sky = schedule, coral = alerts. */
:root {
  --bg: #000000;
  --s1: #0b0c0c;
  --s2: #131514;
  --s3: #1c1f1d;
  --s4: #262a28;
  --hair: rgba(255,255,255,0.07);
  --fg: #f5f7f6;
  --fg2: #a2a8a5;
  --fg3: #676d6a;
  --mint: #7ed597;
  --mint-ink: #03140a;
  --amber: #ffb45e;
  --violet: #a99bff;
  --sky: #6ec6ff;
  --coral: #ff6b5e;
  --display: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
  --body: 'Poppins', 'Helvetica Neue', Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--body); }
h1, h2, h3 { font-family: var(--display); margin: 0; letter-spacing: -0.02em; text-wrap: balance; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--mint); outline-offset: 2px; }
input, textarea, select { font: inherit; color: var(--fg); }
svg { display: block; }
.num { font-variant-numeric: tabular-nums; }
.ic { width: 20px; height: 20px; }
.sm { width: 16px; height: 16px; }

/* ---- Shell ------------------------------------------------------------- */
.shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100%; }
.side { position: sticky; top: 0; height: 100vh; padding: 24px 14px; border-right: 1px solid var(--hair); display: flex; flex-direction: column; gap: 4px; background: var(--s1); }
.side .logo { display: flex; align-items: center; gap: 10px; padding: 0 10px 22px; }
.side .logo img { height: 22px; width: auto; }
.side .logo span { font: 600 11px var(--display); letter-spacing: .14em; color: var(--fg3); text-transform: uppercase; }
.nav { display: flex; align-items: center; gap: 12px; height: 42px; padding: 0 12px; border-radius: 12px; color: var(--fg2); font-weight: 500; position: relative; width: 100%; text-align: left; }
.nav:hover { background: var(--s2); color: var(--fg); }
.nav.on { background: var(--s3); color: var(--fg); }
.nav.on svg { color: var(--mint); }
.nav .count { margin-left: auto; min-width: 22px; height: 20px; border-radius: 10px; font: 700 11px var(--display); display: grid; place-items: center; padding: 0 6px; }
.side .me { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 14px; background: var(--s2); }
.side .me b { display: block; font-size: 13px; }
.side .me small { color: var(--fg3); font-size: 12px; }
.main { min-width: 0; padding-block: 28px 60px; padding-left: max(36px, env(safe-area-inset-left, 0px)); padding-right: max(36px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 24px; }
@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { position: sticky; z-index: 10; height: auto; flex-direction: row; overflow-x: auto; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); border-right: 0; border-bottom: 1px solid var(--hair); scrollbar-width: none; top: env(safe-area-inset-top, 0px); }
  .side .logo, .side .me { display: none; }
  .nav { width: auto; flex: none; }
  .main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}

/* ---- Common ------------------------------------------------------------ */
.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; }
.head h1 { font-size: 30px; font-weight: 800; }
.head p { margin: 4px 0 0; color: var(--fg3); }
.eyebrow { font: 600 11px var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--fg3); }
.card { background: var(--s2); border-radius: 20px; border: 1px solid var(--hair); }
.pad { padding: 20px; }
.sec { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.sec h2 { font-size: 16px; font-weight: 700; display: flex; gap: 8px; align-items: center; }
.sec .muted { color: var(--fg3); font-size: 13px; }
.btn { height: 40px; padding: 0 16px; border-radius: 12px; font: 600 13px var(--display); display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.btn.mint { background: var(--mint); color: var(--mint-ink); }
.btn.white { background: var(--fg); color: #000; }
.btn.ghost { background: var(--s3); color: var(--fg); }
.btn.line { border: 1px solid var(--hair); color: var(--fg2); }
.btn.violet { background: rgba(169,155,255,.14); color: var(--violet); }
.btn[disabled] { opacity: .4; cursor: default; }
.iconbtn { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--fg2); }
.iconbtn:hover { background: var(--s3); color: var(--fg); }
.av { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font: 700 13px var(--display); flex: none; }
.tag { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 12px; font-size: 12px; font-weight: 500; white-space: nowrap; }
.tag .sm { width: 13px; height: 13px; }
.t-mint { background: rgba(126,213,151,.14); color: var(--mint); }
.t-amber { background: rgba(255,180,94,.14); color: var(--amber); }
.t-violet { background: rgba(169,155,255,.14); color: var(--violet); }
.t-sky { background: rgba(110,198,255,.14); color: var(--sky); }
.t-coral { background: rgba(255,107,94,.14); color: var(--coral); }
.t-grey { background: var(--s3); color: var(--fg2); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chipbtn { height: 34px; padding: 0 14px; border-radius: 17px; background: var(--s2); border: 1px solid var(--hair); color: var(--fg2); font-size: 13px; font-weight: 500; }
.chipbtn.on { background: var(--fg); color: #000; border-color: var(--fg); }
.grid2 { display: grid; gap: 20px; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); }
@media (max-width: 1100px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.tile { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; flex: none; }

/* ---- Today ------------------------------------------------------------- */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 760px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { padding: 18px; display: flex; gap: 14px; align-items: center; text-align: left; width: 100%; }
.kpi b { font: 800 28px var(--display); line-height: 1; display: block; }
.kpi small { color: var(--fg3); font-size: 12px; }
.alist { display: grid; }
.arow { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 18px; border-top: 1px solid var(--hair); }
.arow:first-child { border-top: 0; }
.arow .who { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.arow .who b { font: 700 14px var(--display); }
.arow p { margin: 2px 0 0; color: var(--fg2); font-size: 13px; }
.arow .acts { display: flex; gap: 2px; }
.arow.done { opacity: .35; }
.appr { padding: 16px 18px; border-top: 1px solid var(--hair); display: grid; gap: 10px; }
.appr:first-child { border-top: 0; }
.appr .top { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; }
.appr .top b { font: 700 14px var(--display); }
.appr .draft { background: var(--s1); border-radius: 12px; padding: 12px 14px; color: var(--fg2); font-size: 13px; }
.appr .row { display: flex; gap: 8px; flex-wrap: wrap; }
.tl { display: grid; }
.tli { display: grid; grid-template-columns: 54px 4px minmax(0, 1fr); gap: 14px; padding: 12px 18px; align-items: center; }
.tli time { font: 700 14px var(--display); }
.tli .bar { height: 38px; border-radius: 2px; }
.tli b { display: block; font-weight: 600; }
.tli small { color: var(--fg3); }

/* ---- Clients ----------------------------------------------------------- */
.toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.search { display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 14px; border-radius: 12px; background: var(--s2); border: 1px solid var(--hair); min-width: 0; flex: 0 1 320px; color: var(--fg3); }
.search input { background: none; border: 0; flex: 1; min-width: 0; }
.search input:focus { outline: none; }
.ctable { overflow-x: auto; }
.crow { display: grid; grid-template-columns: minmax(200px, 1.4fr) minmax(150px, 1fr) 150px 120px 130px 30px; gap: 16px; align-items: center; padding: 14px 18px; border-top: 1px solid var(--hair); width: 100%; text-align: left; min-width: 820px; }
.crow:hover { background: var(--s3); }
.crow.th { color: var(--fg3); font: 600 11px var(--display); letter-spacing: .1em; text-transform: uppercase; border-top: 0; padding-block: 12px; }
.crow.th:hover { background: none; }
.crow .nm { display: flex; gap: 12px; align-items: center; }
.crow .nm b { display: block; font-weight: 600; }
.crow .nm small { color: var(--fg3); font-size: 12px; }
.meter { display: flex; align-items: center; gap: 10px; }
.meter .track { flex: 1; height: 6px; border-radius: 3px; background: var(--s4); overflow: hidden; }
.meter .track i { display: block; height: 100%; border-radius: 3px; }

/* ---- Client profile ---------------------------------------------------- */
.prof { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.prof .av { width: 64px; height: 64px; font-size: 20px; }
.prof h1 { font-size: 28px; font-weight: 800; }
.prof .meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.prof .grow { flex: 1; min-width: 220px; }
.flag { display: flex; gap: 10px; align-items: center; padding: 12px 16px; border-radius: 14px; background: rgba(255,107,94,.08); border: 1px solid rgba(255,107,94,.25); color: var(--fg); font-size: 13px; }
.flag svg { color: var(--coral); flex: none; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--hair); overflow-x: auto; scrollbar-width: none; }
.tabs button { height: 44px; padding: 0 16px; color: var(--fg3); font-weight: 500; display: inline-flex; gap: 8px; align-items: center; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button.on { color: var(--fg); border-color: var(--fg); }

.days { display: flex; gap: 8px; flex-wrap: wrap; }
.day { height: 40px; padding: 0 16px; border-radius: 12px; background: var(--s2); border: 1px solid var(--hair); color: var(--fg2); font-weight: 500; }
.day.on { background: var(--s4); color: var(--fg); border-color: rgba(255,255,255,.18); }
.editor { overflow-x: auto; }
.erow { display: grid; grid-template-columns: 28px minmax(220px, 1.5fr) 110px 150px 110px 190px 120px 36px; gap: 12px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--hair); min-width: 1040px; }
.erow.th { color: var(--fg3); font: 600 11px var(--display); letter-spacing: .1em; text-transform: uppercase; border-top: 0; }
.erow.changed { background: rgba(126,213,151,.04); }
.erow .move { display: grid; gap: 2px; }
.erow .move button { height: 14px; color: var(--fg3); display: grid; place-items: center; }
.erow .move button:hover { color: var(--fg); }
.exname { display: flex; gap: 12px; align-items: center; text-align: left; }
.exname .tile { width: 40px; height: 40px; border-radius: 12px; }
.exname b { display: block; font-weight: 600; }
.exname small { color: var(--fg3); font-size: 12px; display: inline-flex; gap: 4px; align-items: center; }
.exname:hover b { color: var(--mint); }
.stepper { display: inline-grid; grid-template-columns: 30px 34px 30px; align-items: center; height: 36px; border-radius: 10px; background: var(--s1); border: 1px solid var(--hair); }
.stepper button { height: 100%; color: var(--fg2); font-size: 16px; }
.stepper button:hover { color: var(--fg); }
.stepper span { text-align: center; font: 700 14px var(--display); }
.reps { display: inline-flex; align-items: center; gap: 6px; }
.reps input, .field input, .field select { width: 48px; height: 36px; border-radius: 10px; background: var(--s1); border: 1px solid var(--hair); text-align: center; font: 700 14px var(--display); }
select.rest { width: 100%; height: 36px; border-radius: 10px; background: var(--s1); border: 1px solid var(--hair); padding: 0 8px; font-weight: 500; }
.prio { display: inline-grid; grid-template-columns: repeat(3, 1fr); background: var(--s1); border: 1px solid var(--hair); border-radius: 10px; padding: 3px; gap: 2px; }
.prio button { height: 28px; border-radius: 7px; font-size: 11px; font-weight: 600; color: var(--fg3); padding: 0 6px; white-space: nowrap; }
.prio button.on.p0 { background: rgba(126,213,151,.18); color: var(--mint); }
.prio button.on.p1 { background: rgba(255,180,94,.18); color: var(--amber); }
.prio button.on.p2 { background: rgba(255,107,94,.16); color: var(--coral); }
.nextload { font: 700 14px var(--display); display: inline-flex; gap: 6px; align-items: center; }
.nextload small { font: 500 11px var(--body); color: var(--fg3); display: block; }
.efoot { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 16px; border-top: 1px solid var(--hair); flex-wrap: wrap; }
.publish { position: sticky; bottom: 16px; z-index: 5; display: flex; align-items: center; gap: 14px; justify-content: space-between; padding: 12px 12px 12px 20px; border-radius: 18px; background: rgba(28,31,29,.92); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.12); box-shadow: 0 20px 50px rgba(0,0,0,.6); flex-wrap: wrap; }
.publish b { font-family: var(--display); }
.publish span { color: var(--fg2); }

.targets { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 700px) { .targets { grid-template-columns: minmax(0, 1fr); } }
.tgt { padding: 16px; border-radius: 16px; background: var(--s1); display: grid; gap: 10px; }
.tgt .lbl { display: flex; gap: 8px; align-items: center; color: var(--fg2); font-size: 13px; }
.tgt .val { display: flex; align-items: center; justify-content: space-between; }
.tgt .val b { font: 800 26px var(--display); }
.tgt .val b small { font-size: 13px; color: var(--fg3); font-weight: 600; margin-left: 4px; }
.tgt .val .stepper { grid-template-columns: 34px 34px; }
.switch { display: flex; align-items: center; gap: 12px; }
.switch button { width: 46px; height: 28px; border-radius: 14px; background: var(--s4); position: relative; transition: background .2s; flex: none; }
.switch button::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .2s; }
.switch button[aria-checked="true"] { background: var(--mint); }
.switch button[aria-checked="true"]::after { transform: translateX(18px); }
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.ph { border-radius: 16px; overflow: hidden; background: var(--s1); position: relative; text-align: left; }
.ph img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; }
.ph .cap { padding: 10px 12px; display: grid; gap: 2px; }
.ph .cap b { font-size: 13px; font-weight: 600; }
.ph .cap small { color: var(--fg3); font-size: 12px; }
.ph .react { position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border-radius: 50%; background: rgba(0,0,0,.55); backdrop-filter: blur(8px); display: grid; place-items: center; color: #fff; }
.ph .react.on { background: var(--amber); color: #2a1600; }
textarea.fb { width: 100%; min-height: 120px; resize: vertical; background: var(--s1); border: 1px solid rgba(169,155,255,.35); border-radius: 14px; padding: 14px; font-size: 14px; line-height: 1.6; }

.timeline { display: grid; }
.ev { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 14px; padding: 12px 0; align-items: center; border-top: 1px solid var(--hair); }
.ev:first-child { border-top: 0; }
.ev .tile { width: 36px; height: 36px; border-radius: 11px; }
.ev b { font-weight: 600; display: block; }
.ev small { color: var(--fg3); font-size: 12px; }
.ev time { color: var(--fg3); font-size: 12px; white-space: nowrap; }
.statrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.statrow .card { padding: 16px; }
.statrow b { font: 800 24px var(--display); display: block; }
.statrow small { color: var(--fg3); font-size: 12px; }

.ci { display: grid; grid-template-columns: 110px repeat(4, minmax(70px, 1fr)) minmax(160px, 2fr); gap: 12px; align-items: center; padding: 14px 18px; border-top: 1px solid var(--hair); min-width: 720px; }
.ci.th { color: var(--fg3); font: 600 11px var(--display); letter-spacing: .1em; text-transform: uppercase; border-top: 0; }
.dots { display: flex; gap: 3px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--s4); }

/* ---- Other sections ---------------------------------------------------- */
.cards3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.prog { padding: 18px; display: grid; gap: 14px; }
.prog .top { display: flex; gap: 12px; align-items: center; }
.prog b { font: 700 16px var(--display); display: block; }
.prog small { color: var(--fg3); font-size: 12px; }
.prog .foot { display: flex; justify-content: space-between; align-items: center; }
.lib { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.lx { padding: 14px; display: grid; gap: 10px; text-align: left; }
.lx .vid { aspect-ratio: 16 / 10; max-width: 100%; border-radius: 12px; display: grid; place-items: center; position: relative; overflow: hidden; }
.lx .vid img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .8; }
.lx .vid .play { position: relative; width: 36px; height: 36px; border-radius: 50%; background: rgba(0,0,0,.5); backdrop-filter: blur(6px); display: grid; place-items: center; color: #fff; }
.lx b { font-weight: 600; }
.week { display: grid; grid-template-columns: repeat(7, minmax(120px, 1fr)); gap: 10px; overflow-x: auto; }
.wday { display: grid; gap: 8px; align-content: start; min-width: 120px; }
.wday h3 { font-size: 13px; color: var(--fg2); font-weight: 600; }
.wday h3 b { display: block; font-size: 22px; color: var(--fg); font-weight: 800; }
.wday.today h3 b { color: var(--mint); }
.slot { padding: 10px 12px; border-radius: 12px; font-size: 12px; display: grid; gap: 2px; text-align: left; }
.slot b { font: 700 13px var(--display); }
.slot.open { border: 1px dashed var(--hair); color: var(--fg3); }
.slot.studio { background: rgba(126,213,151,.12); color: var(--fg); box-shadow: inset 3px 0 0 var(--mint); }
.slot.gym { background: rgba(110,198,255,.12); color: var(--fg); box-shadow: inset 3px 0 0 var(--sky); }
.slot.online { background: rgba(169,155,255,.12); color: var(--fg); box-shadow: inset 3px 0 0 var(--violet); }
.msgs-wrap { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: 560px; overflow: hidden; }
@media (max-width: 800px) { .msgs-wrap { grid-template-columns: minmax(0, 1fr); } .msgs-wrap .list { display: none; } }
.msgs-wrap .list { border-right: 1px solid var(--hair); }
.conv { display: flex; gap: 12px; padding: 14px 16px; align-items: center; width: 100%; text-align: left; border-top: 1px solid var(--hair); }
.conv.on { background: var(--s3); }
.conv b { font-weight: 600; display: block; }
.conv small { color: var(--fg3); font-size: 12px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.conv > span:nth-child(2) { min-width: 0; flex: 1; }
.conv .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mint); flex: none; }
.thread { display: flex; flex-direction: column; }
.thread .body { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
.bub { max-width: 70%; padding: 10px 14px; border-radius: 18px; font-size: 14px; }
.bub.them { background: var(--s3); align-self: flex-start; border-bottom-left-radius: 6px; }
.bub.me { background: var(--mint); color: var(--mint-ink); align-self: flex-end; border-bottom-right-radius: 6px; }
.thread .comp { display: flex; gap: 8px; padding: 14px; border-top: 1px solid var(--hair); }
.thread .comp input { flex: 1; min-width: 0; height: 42px; border-radius: 12px; background: var(--s1); border: 1px solid var(--hair); padding: 0 14px; }
.rules { display: grid; }
.rule { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 16px 20px; border-top: 1px solid var(--hair); }
.rule:first-child { border-top: 0; }
.rule b { font-weight: 600; display: block; }
.rule small { color: var(--fg3); }
.rule .right { display: flex; gap: 12px; align-items: center; }

/* ---- Modal & toast ----------------------------------------------------- */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.6); backdrop-filter: blur(6px); display: grid; place-items: center; padding: 20px; }
.modal { width: min(560px, 100%); max-height: 80vh; overflow: auto; background: var(--s2); border: 1px solid var(--hair); border-radius: 24px; padding: 22px; display: grid; gap: 16px; }
.modal .opt { display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 14px; background: var(--s1); width: 100%; text-align: left; }
.modal .opt:hover { background: var(--s3); }
.modal .opt b { font-weight: 600; display: block; }
.modal .opt small { color: var(--fg3); font-size: 12px; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: var(--fg); color: #000; padding: 12px 20px; border-radius: 14px; font-weight: 500; box-shadow: 0 10px 40px rgba(0,0,0,.5); display: flex; gap: 10px; align-items: center; max-width: calc(100% - 32px); }
.toast[hidden] { display: none; }
@media (max-width: 700px) {
  .crow { grid-template-columns: minmax(0, 1fr) auto; min-width: 0; }
  .crow > span:nth-child(2), .crow > span:nth-child(3), .crow > span:nth-child(4), .crow > span:nth-child(6) { display: none; }
}
@media (prefers-reduced-motion: no-preference) { .fade { animation: fade .25s ease; } @keyframes fade { from { opacity: 0; transform: translateY(4px); } } }

/* ---- Refined system ----------------------------------------------------

   underlined text tabs. Corners are tighter and buttons squarer.
   KAI (AI) is always violet with the orb; Kyle is mint. */
.card { border-radius: 12px; }
.tag { background: none !important; padding: 0; height: auto; border-radius: 0; gap: 6px; font-weight: 500; }
.tag:not(:has(svg))::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
.chips { gap: 20px; }
.chipbtn { height: 36px; padding: 0; border: 0; border-radius: 0; background: none; color: var(--fg3); border-bottom: 2px solid transparent; }
.chipbtn.on { background: none; color: var(--fg); border-color: var(--fg); }
.btn { border-radius: 8px; }
.iconbtn { border-radius: 8px; }
.day { border-radius: 8px; }
.nav { border-radius: 8px; }

.search { border-radius: 8px; }
.tile { border-radius: 10px; }
.kpi .tile { border-radius: 10px; }
.stepper, .reps input, select.rest, .prio, .field input { border-radius: 8px; }
.prio button { border-radius: 6px; }
.flag { border-radius: 10px; }
.modal { border-radius: 16px; }
.toast { border-radius: 10px; }
.slot { border-radius: 8px; }
.tgt, .ph { border-radius: 10px; }
.publish { border-radius: 12px; }
.orb { width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 32% 28%, #e3dcff 0%, #a99bff 38%, #4b3cc4 100%); display: inline-grid; place-items: center; color: #fff; flex: none; }
.orb svg { width: 12px; height: 12px; }
.sc-label { display: inline-flex; gap: 8px; align-items: center; color: var(--violet); font-weight: 600; font-size: 12px; }
.tile.solid { background: var(--s3); color: var(--fg) !important; box-shadow: none; }
.tile.solid svg { width: 22px; height: 22px; }
.nav svg { width: 21px; height: 21px; }
.nav { color: #8a908c; }
.orb svg { width: 64%; height: 64%; }
.cilist { display: grid; }
.cirow { display: grid; grid-template-columns: 130px minmax(0, 1.6fr) minmax(170px, 1fr) minmax(150px, .9fr); gap: 20px; padding: 18px 20px; border-top: 1px solid var(--hair); align-items: start; }
.cirow:first-child { border-top: 0; }
@media (max-width: 1000px) { .cirow { grid-template-columns: minmax(0, 1fr); gap: 10px; } }
.cirow .when b { display: block; font-weight: 600; }
.cirow .feel { font-size: 14px; color: var(--fg); margin: 0 0 8px; }
.cirow .winlist { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--mint); }

function nextLoad(row) {
  const [load, reps] = row.last;
  if (row.inc === 0) return { txt: 'BW', up: false };
  const hit = reps.length >= row.sets && reps.every(x => x >= row.r[1]);
  return { txt: `${hit ? load + row.inc : load} kg`, up: hit, why: hit ? 'Top of range every set' : 'Hold until every set hits ' + row.r[1] };
}

  const th = { priya: [['them', 'Hey Kyle, race is Sunday!'], ['sys', 'KAI handed this over: race-day advice is your call'], ['them', 'Can I train legs the day after my 10k?']], sarah: [['me', 'Great session Monday. Leg press goes up today 💪'], ['them', 'Knee felt a bit tight on the lunges'], ['sys', 'KAI handed this over: pain is always yours'], ['them', 'My knee aches during lunges. Can you take a look?']],

    <span><b>${x.name}</b></span><span class="chips"><span class="tag" style="background:${bg};color:${fg}">${x.pat}</span><span class="tag t-grey">${x.kit}</span>${x.filmed ? '' : '<span class="tag t-amber">To film</span>'}</span></button>`; }).join('')}</div>`;

const RECIPES = [['pasta', 'Creamy Cajun Chicken Pasta', 45], ['potato-bowl', 'Big Mac Loaded Potato Bowl', 42], ['wrap', 'High-Protein Breakfast Wrap', 41], ['turkey-pasta', 'Turkey & Pasta Tomato Bowl', 40], ['breakfast', 'Eggs, Veg & Sourdough', 32]];
function vCommunity() {
  const d = S.drop;
  return `<div class="head"><div><h1>Community</h1><p>One drop every Monday at 07:00: a tip and 3 high-protein meals. Every client gets a push.</p></div>
    <button class="btn line" data-toast="Post an announcement now">${ic('megaphone', 'sm')}Announcement</button></div>
  <div class="grid2">
    <section class="card pad" style="display:grid;gap:16px;align-content:start">
      <div class="sec" style="margin:0"><h2>Week 44 · Monday 26 October</h2>${d.scheduled ? `<span class="tag t-mint">${ic('check', 'sm')}Scheduled</span>` : `<span class="tag t-grey">Draft</span>`}</div>
      <label style="display:grid;gap:6px"><span class="eyebrow">Tip of the week</span><input id="tipT" value="${d.title}" style="height:44px;border-radius:12px;background:var(--s1);border:1px solid var(--hair);padding:0 14px;font:700 15px var(--display)"></label>
      <textarea class="fb" id="tipB" style="border-color:var(--hair);min-height:90px" aria-label="Tip text">${d.body}</textarea>
      <div><div class="sec" style="margin-bottom:10px"><span class="eyebrow">3 high-protein meals</span><span class="muted">Tap a meal to swap it</span></div>
        <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">${d.meals.map((m, i) => { const r = RECIPES[m]; return `<button class="ph" data-meal="${i}" title="Swap meal"><img src="assets/${r[0]}.jpg" alt=""><span class="react" style="background:rgba(0,0,0,.55)">${ic('swap', 'sm')}</span><span class="cap"><b>${r[1]}</b><small style="color:var(--amber)">${r[2]}g protein</small></span></button>`; }).join('')}</div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn mint" data-sched>${ic('check', 'sm')}${d.scheduled ? 'Update' : 'Schedule for Monday'}</button><button class="btn violet" data-tipai>${ic('spark', 'sm')}KAI draft</button></div>
    </section>
    <section style="display:grid;gap:20px;align-content:start">
      <div><div class="sec"><h2>Last week's drop</h2><span class="muted">Week 43</span></div>
        <div class="statrow"><div class="card"><b class="num" style="color:var(--violet)">29/35</b><small>Opened</small></div><div class="card"><b class="num" style="color:var(--coral)">23</b><small>Reactions</small></div><div class="card"><b class="num" style="color:var(--amber)">41</b><small>Meals saved</small></div></div></div>
      <div><div class="sec"><h2>Announcements</h2></div>
        <div class="card">${[['flame', 'amber', 'November challenge: 10k steps', '12 clients joined'], ['megaphone', 'sky', 'Studio closed Monday 3 November', 'Posted Mon 19 Oct']].map(([i, c, t, m]) => `<div class="ev" style="padding:14px 18px">${tileHTML(i, c)}<span><b>${t}</b><small>${m}</small></span><span></span></div>`).join('')}</div></div>
      <div><div class="sec"><h2>Past drops</h2></div>
        <div class="card">${[['Week 43', 'Front-load your protein'], ['Week 42', 'Sleep: the free recovery tool'], ['Week 41', 'How to warm up in 5 minutes']].map(([w, t]) => `<div class="ev" style="padding:14px 18px">${tileHTML('community', 'violet')}<span><b>${t}</b><small>${w} · tip + 3 meals</small></span><span></span></div>`).join('')}</div></div>
    </section>
  </div>`;
}

function vAutomation() {
  const R = [['prog', 'arrowup', 'mint', 'Progression', 'Add one load jump when every working set hits the top of the range', 'Auto'],
    ['alert', 'pain', 'coral', 'Missed-workout alert', 'Flag a client when their gap is twice their usual', 'Auto'],
    ['release', 'calup', 'sky', 'Booking release', 'Open next month on the 20th at 18:00, regular slots first', 'Auto'],
    ['remind', 'clip', 'violet', 'Check-in reminder', 'On each client\'s chosen day and frequency, 09:00, again at 18:00 if not done', 'Auto'],
    ['payRemind', 'card', 'amber', 'Payment reminders', '3 days before, on the day, then every 3 days until paid. Alert me after 3 days', 'Auto'],
    ['sessRemind', 'bell', 'sky', 'Session reminders', 'The evening before, with the cancellation cut-off', 'Auto'],
    ['drop', 'community', 'violet', 'Weekly drop', 'Monday 07:00 with a push to every client', 'Auto'],
    ['aiAnswer', 'messages', 'violet', 'KAI answers', 'Questions about the client\'s own plan. Pain, injury and plan changes come to you', 'Auto'],
    ['aiDraft', 'spark', 'violet', 'KAI drafts', 'Programme changes, nutrition feedback, replies and weekly tips', 'Needs approval']];
  return `<div class="head"><div><h1>Automation</h1><p>Your rules, applied the same way to every client.</p></div></div>
  <div class="card rules">${R.map(([k, i, c, t, d, m]) => `<div class="rule">${tileHTML(i, c)}<span><b>${t}</b><small>${d}</small></span>
    <span class="right"><span class="tag ${m === 'Auto' ? 't-grey' : 't-violet'}">${m}</span><span class="switch"><button role="switch" aria-checked="${S.rules[k]}" data-rule="${k}" aria-label="${t}"></button></span></span></div>`).join('')}</div>`;
}

// ---------------------------------------------------------------------------
// Render
// ---------------------------------------------------------------------------
const NAV = [['today', 'Today', 6, 'coral'], ['clients', 'Clients'], ['programmes', 'Programmes'], ['schedule', 'Schedule'], ['messages', 'Messages', 3, 'mint'], ['community', 'Community'], ['library', 'Library'], ['automation', 'Automation']];
const $ = id => document.getElementById(id);

function render(keep) {
  const y = window.scrollY;
  const active = S.view === 'client' ? 'clients' : S.view;
  $('side').innerHTML = `<div class="logo"><img src="assets/kd-mark.png" alt="KD"><span>Coach</span></div>
    ${NAV.map(([k, l, n, c]) => { const t = c && tint(c); return `<button class="nav ${active === k ? 'on' : ''}" data-go="${k}">${ic(k)}${l}${n ? `<span class="count" style="background:${t[0]};color:${t[1]}">${n}</span>` : ''}</button>`; }).join('')}
    <div class="me"><img src="assets/kd-mark.png" alt="" style="width:34px;height:34px;border-radius:50%;background:#000;object-fit:contain;padding:8px 5px;border:1px solid var(--hair)"><span><b>Kyle</b><small>Head coach</small></span></div>`;
  const v = S.view;
  $('main').innerHTML = `<div class="fade" style="display:grid;gap:24px">${v === 'today' ? vToday() : v === 'clients' ? vClients() : v === 'client' ? vClient() : v === 'programmes' ? vProgrammes()
    : v === 'schedule' ? vSchedule() : v === 'messages' ? vMessages() : v === 'library' ? vLibrary() : v === 'community' ? vCommunity() : vAutomation()}</div>`;
  if (!keep) $('main').firstElementChild.classList.add('fade'); else $('main').firstElementChild.classList.remove('fade');
  $('layer').innerHTML = S.modal ? modalHTML() : '';
  window.scrollTo(0, keep ? y : 0);
}
function modalHTML() {
  const { mode, i } = S.modal;
  const cur = mode === 'swap' ? lib(S.prog[S.day][i].ex) : null;
  const opts = LIB.filter(x => !cur || (x.pat === cur.pat && x.id !== cur.id));
  return `<div class="scrim" data-scrim><div class="modal" role="dialog" aria-modal="true">
    <div class="sec" style="margin:0"><h2>${mode === 'swap' ? `Swap ${cur.name}` : 'Add exercise'}</h2><button class="iconbtn" data-closemodal aria-label="Close">${ic('close')}</button></div>
    ${mode === 'swap' ? `<span class="muted" style="color:var(--fg3)">Same movement pattern: ${cur.pat}</span>` : ''}
    <div style="display:grid;gap:8px">${opts.map(x => `<button class="opt" data-pick="${x.id}">${tileHTML('library', x.c)}<span><b>${x.name}</b><small>${x.pat} · ${x.kit}</small></span></button>`).join('')}</div>
  </div></div>`;
}
function toast(m) { const t = $('toast'); t.innerHTML = ic('check', 'sm') + m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2600); }
function go(v) { S.view = v; S.modal = null; try { history.replaceState(null, '', '#' + v); } catch (e) {} render(false); }

document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-scrim]'); if (!t) return;
  const d = t.dataset;
  if (d.scrim !== undefined && e.target !== t) return;
  const rows = S.prog[S.day];
  if (d.go) return go(d.go);
  if (d.toast) return toast(d.toast);
  if (d.client) { S.client = d.client; S.ctab = d.client === 'sarah' ? 'training' : 'overview'; return go('client'); }
  if (d.ctab) { S.ctab = d.ctab; return render(true); }
  if (d.filter) { S.filter = d.filter; return render(true); }
  if (d.lf) { S.libFilter = d.lf; return render(true); }
  if (d.done) { S.done[d.done] = d.l; return render(true); }
  if (d.edit) { S.editing = d.edit; return render(true); }
  if (d.approve) { const ta = $('ed-' + d.approve); const p = APPROVALS.find(x => x.id === d.approve); if (ta) p.text = ta.value;
    S.approved[d.approve] = ta ? 'Edited & sent' : 'Approved & sent'; S.editing = null; return render(true); }
  if (d.reject) { S.approved[d.reject] = 'Rejected · logged'; S.editing = null; return render(true); }
  if (d.day) { S.day = d.day; return render(true); }
  if (d.sets) { const r = rows[+d.sets]; r.sets = Math.max(1, Math.min(8, r.sets + +d.d)); return render(true); }
  if (d.prio) { rows[+d.prio].prio = +d.k; return render(true); }
  if (d.mv) { const i = +d.mv, j = i + +d.dir; if (j < 0 || j >= rows.length) return; [rows[i], rows[j]] = [rows[j], rows[i]]; return render(true); }
  if (d.del) { rows.splice(+d.del, 1); return render(true); }
  if (d.swap) { S.modal = { mode: 'swap', i: +d.swap }; return render(true); }
  if (d.add !== undefined) { S.modal = { mode: 'add' }; return render(true); }
  if (d.pick) {
    if (S.modal.mode === 'swap') { rows[S.modal.i].ex = d.pick; }
    else rows.push({ ex: d.pick, sets: 3, r: [10, 12], rest: 90, prio: 1, last: [0, []], inc: 0 });
    S.modal = null; return render(true);
  }
  if (d.closemodal !== undefined || d.scrim !== undefined) { S.modal = null; return render(true); }
  if (d.publish !== undefined) { S.saved = clone(S.prog); toast('Published · Sarah sees it next session'); return render(true); }
  if (d.discard !== undefined) { S.prog = clone(S.saved); return render(true); }
  if (d.nut) { const k = d.nut; S.nut[k] = Math.max(0, Math.round((S.nut[k] + +d.d) * 10) / 10); return render(true); }
  if (d.toggleShow !== undefined) { S.nut.show = !S.nut.show; return render(true); }
  if (d.react) { S.nut.reacted[d.react] = !S.nut.reacted[d.react]; return render(true); }
  if (d.sendfb !== undefined) { S.nut.fbSent = true; return render(true); }
  if (d.rule) { S.rules[d.rule] = !S.rules[d.rule]; return render(true); }
  if (d.meal) { const m = S.drop.meals, i = +d.meal; let n = m[i]; do { n = (n + 1) % RECIPES.length; } while (m.includes(n)); m[i] = n; S.drop.scheduled = false; return render(true); }
  if (d.sched !== undefined) { S.drop.title = $('tipT').value; S.drop.body = $('tipB').value; S.drop.scheduled = true; toast('Scheduled · Monday 07:00 to 35 clients'); return render(true); }
  if (d.tipai !== undefined) { $('tipT').value = 'Walk after your biggest meal'; $('tipB').value = 'A 10-minute walk after dinner helps digestion, adds 1,000+ steps and counts towards the November challenge.'; return; }
  if (d.conv) { S.conv = d.conv; return render(true); }
  if (d.aidraft !== undefined) { $('reply').value = S.conv === 'priya' ? 'Good luck Sunday! Keep Monday easy: swap to the upper-body day and we\'ll do legs Wednesday.' : 'Thanks for letting me know. Let\'s go through it Saturday.'; return; }
  if (d.sendmsg !== undefined) { const v = $('reply').value.trim(); if (!v) return; S.sent.push([S.conv, v]); return render(true); }
});
document.addEventListener('input', e => {
  const i = e.target, rows = S.prog[S.day];
  if (i.id === 'q') { S.q = i.value; const pos = i.selectionStart; render(true); const q = $('q'); q.focus(); q.setSelectionRange(pos, pos); return; }
  if (i.dataset.rr) { const n = parseInt(i.value, 10); if (!isNaN(n)) { rows[+i.dataset.rr].r[+i.dataset.k] = n; updatePublishBar(); } }
});
document.addEventListener('change', e => {
  const i = e.target;
  if (i.dataset.rest) { S.prog[S.day][+i.dataset.rest].rest = +i.value; render(true); }
});
function updatePublishBar() { const had = !!document.querySelector('.publish'); if (had !== dirty()) render(true); }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.modal) { S.modal = null; render(true); } });

const h = (location.hash || '').slice(1);
if (NAV.some(n => n[0] === h)) S.view = h;
if (h === 'sarah') { S.view = 'client'; S.client = 'sarah'; }
render(false);
</script>
